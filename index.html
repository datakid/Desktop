<style>
:root{
  --f-ui:'Geist','Inter Tight',-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Geist Mono','JetBrains Mono',ui-monospace,monospace;
  --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px;
  --fs-16:16px; --fs-20:20px; --fs-26:26px; --fs-34:34px;
  --fs-48:48px; --fs-72:72px;
  --tr-tight:-0.022em; --tr-display:-0.035em; --tr-mono:0.01em;
  --lh-ui:1.35; --lh-body:1.5;

  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px;
  --s-6:24px; --s-8:32px; --s-10:40px; --s-14:56px; --s-18:72px;

  --r-1:6px; --r-2:10px; --r-3:14px; --r-4:20px; --r-f:999px;

  --t-1:110ms; --t-2:170ms; --t-3:260ms; --t-4:420ms;
  --e-out:cubic-bezier(.2,.9,.25,1);
  --e-in:cubic-bezier(.5,0,.9,.3);
  --e-io:cubic-bezier(.6,0,.2,1);

  --hair:1px;
  --z-desktop:1; --z-window:300; --z-dock:500; --z-topbar:600;
  --z-palette:800; --z-toast:900; --z-boot:1000;
}

[data-theme="dark"]{
  --bg-void:#0A0B0C;
  --bg-base:#0E1013;
  --bg-raise:#15181C;
  --bg-float:#1C2026;
  --bg-hover:rgba(255,255,255,.045);
  --bg-press:rgba(255,255,255,.015);
  --line-1:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.13);
  --edge:inset 0 1px 0 rgba(255,255,255,.06);
  --tx-1:#EDEFF2; --tx-2:#A2A9B4; --tx-3:#6C7480;
  --sig:#FFB01F; --sig-ink:#171100; --sig-dim:rgba(255,176,31,.13);
  --live:#54D6C4; --dngr:#FF5C52;
  --e1:0 1px 1px rgba(0,0,0,.22), 0 2px 6px rgba(0,0,0,.18);
  --e2:0 2px 4px rgba(0,0,0,.24), 0 10px 26px rgba(0,0,0,.28);
  --e3:0 6px 12px rgba(0,0,0,.28), 0 28px 70px rgba(0,0,0,.44);
  --e4:0 10px 20px rgba(0,0,0,.32), 0 42px 100px rgba(0,0,0,.52);
  color-scheme:dark;
}

[data-theme="light"]{
  --bg-void:#EDEAE4;
  --bg-base:#F3F1ED;
  --bg-raise:#FAF9F7;
  --bg-float:#FFFFFF;
  --bg-hover:rgba(24,22,18,.04);
  --bg-press:rgba(24,22,18,.07);
  --line-1:rgba(24,22,18,.09);
  --line-2:rgba(24,22,18,.16);
  --edge:inset 0 1px 0 rgba(255,255,255,.9);
  --tx-1:#191714; --tx-2:#5C574F; --tx-3:#8C867C;
  --sig:#B8730C; --sig-ink:#FFFFFF; --sig-dim:rgba(184,115,12,.11);
  --live:#0E8F7E; --dngr:#C0392B;
  --e1:0 1px 1px rgba(40,32,20,.05), 0 2px 6px rgba(40,32,20,.06);
  --e2:0 2px 4px rgba(40,32,20,.06), 0 10px 26px rgba(40,32,20,.09);
  --e3:0 6px 12px rgba(40,32,20,.08), 0 28px 70px rgba(40,32,20,.16);
  --e4:0 10px 20px rgba(40,32,20,.10), 0 42px 100px rgba(40,32,20,.22);
  color-scheme:light;
}

@media (min-resolution:2dppx){ :root{ --hair:0.5px; } }

[data-theme="dark"][data-accent="cyan"]{ --sig:#33C2FF; --sig-ink:#071C24; --sig-dim:rgba(51,194,255,.13); }
[data-theme="light"][data-accent="cyan"]{ --sig:#0E7FB8; --sig-ink:#FFFFFF; --sig-dim:rgba(14,127,184,.11); }
[data-theme="dark"][data-accent="rose"]{ --sig:#FF6F91; --sig-ink:#260008; --sig-dim:rgba(255,111,145,.13); }
[data-theme="light"][data-accent="rose"]{ --sig:#B83A5C; --sig-ink:#FFFFFF; --sig-dim:rgba(184,58,92,.11); }
[data-theme="dark"][data-accent="violet"]{ --sig:#9C8CFF; --sig-ink:#0E0824; --sig-dim:rgba(156,140,255,.13); }
[data-theme="light"][data-accent="violet"]{ --sig:#6C4FD1; --sig-ink:#FFFFFF; --sig-dim:rgba(108,79,209,.11); }

@media (prefers-contrast: more){
  :root{ --contrast-boost:1; }
  [data-theme="dark"]{ --line-1:rgba(255,255,255,.13); --tx-2:#C7CCD4; }
  [data-theme="light"]{ --line-1:rgba(24,22,18,.16); --tx-2:#3D3930; }
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
html{color-scheme:light dark}

[hidden]{ display:none !important }
body{
  font-family:var(--f-ui);
  font-size:var(--fs-14);
  line-height:var(--lh-ui);
  letter-spacing:var(--tr-tight);
  color:var(--tx-1);
  background:var(--bg-void);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow:hidden;
  transition:background var(--t-4) var(--e-io), color var(--t-4) var(--e-io);
}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
ul{list-style:none}

.chrome{user-select:none}

.mono,.tabular{
  font-family:var(--f-mono);
  letter-spacing:var(--tr-mono);
  font-variant-numeric:tabular-nums;
}

h1,h2,h3,.display{letter-spacing:var(--tr-display)}

:focus{outline:none}
:focus-visible{
  outline:2px solid var(--sig);
  outline-offset:2px;
  border-radius:var(--r-1);
}

.vh{
  position:absolute;width:1px;height:1px;
  padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

.live-region{
  position:fixed;bottom:0;left:0;
  width:1px;height:1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;
}

.icon{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

::selection{background:var(--sig-dim);color:var(--tx-1)}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:var(--r-f);border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--tx-3)}

.noscript-notice{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-void);color:var(--tx-1);
  font-family:var(--f-ui);padding:var(--s-6);text-align:center;
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}
.reduce-motion *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}

:root{ --topbar-pad: var(--s-3); }

.substrate{
  position:fixed; inset:0; z-index:0;
  background:var(--bg-void);
}

[data-wallpaper="mesh-1"] .substrate{
  background-image:
    radial-gradient(circle at 14% 18%, rgba(255,176,31,.05), transparent 42%),
    radial-gradient(circle at 82% 12%, rgba(84,214,196,.045), transparent 46%),
    radial-gradient(circle at 76% 84%, rgba(255,255,255,.03), transparent 50%),
    radial-gradient(circle at 20% 88%, rgba(255,255,255,.025), transparent 44%);
}
[data-theme="light"][data-wallpaper="mesh-1"] .substrate{
  background-image:
    radial-gradient(circle at 14% 18%, rgba(184,115,12,.06), transparent 42%),
    radial-gradient(circle at 82% 12%, rgba(14,143,126,.05), transparent 46%),
    radial-gradient(circle at 76% 84%, rgba(24,22,18,.03), transparent 50%),
    radial-gradient(circle at 20% 88%, rgba(24,22,18,.025), transparent 44%);
}
[data-wallpaper="mesh-2"] .substrate{
  background-image:
    radial-gradient(circle at 80% 20%, rgba(255,176,31,.06), transparent 40%),
    radial-gradient(circle at 20% 80%, rgba(84,214,196,.05), transparent 46%);
}
[data-wallpaper="mesh-3"] .substrate{
  background-image:
    radial-gradient(circle at 50% 0%, rgba(255,255,255,.04), transparent 55%),
    radial-gradient(circle at 50% 100%, rgba(255,176,31,.04), transparent 55%);
}

.dot-grid{
  position:fixed; top:0; left:0; z-index:1; pointer-events:none;
  width:640px; height:640px;
  --cx:50vw; --cy:50vh;
  background-image:radial-gradient(circle, var(--line-2) 1px, transparent 1px);
  background-size:22px 22px;
  -webkit-mask-image:radial-gradient(circle 320px at 50% 50%, #000 0%, transparent 100%);
  mask-image:radial-gradient(circle 320px at 50% 50%, #000 0%, transparent 100%);
  opacity:.55;
  transform:translate3d(calc(var(--cx) - 320px), calc(var(--cy) - 320px), 0);
  will-change:transform;
}
@media (max-width: 768px){ .dot-grid{ display:none } }

.topbar{
  position:fixed; top:0; left:0; right:0; z-index:var(--z-topbar);
  height:calc(var(--s-8) + var(--topbar-pad));
  display:flex; align-items:center; justify-content:space-between;
  padding:0 var(--s-4);
  background:var(--bg-raise);
  border-bottom:var(--hair) solid var(--line-1);
  box-shadow:var(--edge);
}
.topbar-side{display:flex; align-items:center; gap:var(--s-3)}
.topbar-logo{width:auto; padding:0 var(--s-3) 0 var(--s-2); gap:var(--s-2); font-size:var(--fs-13); font-weight:600; color:var(--tx-1)}
.topbar-logo .icon{width:16px; height:16px; color:var(--sig)}
.topbar-sep{ width:var(--hair); height:18px; background:var(--line-1) }
.topbar-focused{
  display:flex; align-items:center; gap:var(--s-2);
  height:32px; padding:0 var(--s-3) 0 var(--s-2); border-radius:var(--r-2);
  color:var(--tx-2); font-size:var(--fs-13); max-width:220px;
  transition:background var(--t-2) var(--e-out), color var(--t-2) var(--e-out);
}
.topbar-focused:hover{ background:var(--bg-hover); color:var(--tx-1) }
.topbar-focused-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.topbar-clock{font-size:var(--fs-13); color:var(--tx-2)}
.topbar-btn{
  width:32px; height:32px; border-radius:var(--r-2);
  display:flex; align-items:center; justify-content:center;
  color:var(--tx-2);
  transition:background var(--t-2) var(--e-out), color var(--t-2) var(--e-out), transform var(--t-1) var(--e-out);
}
.topbar-btn:hover{background:var(--bg-hover); color:var(--tx-1)}
.topbar-btn:active{background:var(--bg-press); transform:scale(.92)}
.topbar-btn .icon{width:17px; height:17px}
.topbar-search-chip{ width:auto; padding:0 var(--s-3) 0 var(--s-2); gap:6px; border-radius:var(--r-f); background:var(--bg-hover) }
.topbar-search-chip .mono{ font-size:var(--fs-11); color:var(--tx-3) }
.topbar-search-chip:hover{ background:var(--bg-press) }

html.booting .topbar,
html.booting .dock-wrap,
html.booting .substrate{ opacity:0; transform:translateY(6px) }
html.booting .substrate{ transform:none }
.topbar.boot-in,
.dock-wrap.boot-in,
.substrate.boot-in{
  opacity:1; transform:none;
  transition:opacity var(--t-4) var(--e-out), transform var(--t-4) var(--e-out);
}

.settings-panel{
  position:fixed; inset:0; z-index:var(--z-palette);
  display:flex; align-items:center; justify-content:center;
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity var(--t-3) var(--e-out), visibility var(--t-3);
}
.settings-panel.is-open{ opacity:1; visibility:visible; pointer-events:auto }
.settings-scrim{ position:absolute; inset:0; background:rgba(0,0,0,.32) }
[data-theme="light"] .settings-scrim{ background:rgba(24,22,18,.18) }
.settings-box{
  position:relative; width:420px; max-width:92vw; max-height:80vh; overflow:auto;
  background:var(--bg-float); border:var(--hair) solid var(--line-2);
  border-radius:var(--r-4); box-shadow:var(--e3), var(--edge);
}
.settings-box{ backdrop-filter:blur(20px) saturate(140%); -webkit-backdrop-filter:blur(20px) saturate(140%) }
.reduce-transparency .settings-box{ backdrop-filter:none; -webkit-backdrop-filter:none; background:var(--bg-float) }
.settings-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:var(--s-4) var(--s-5);
  border-bottom:var(--hair) solid var(--line-1);
}
.settings-head h2{ font-size:var(--fs-20); font-weight:650 }
.settings-section{ padding:var(--s-4) var(--s-5); border-bottom:var(--hair) solid var(--line-1) }
.settings-section:last-child{ border-bottom:none }
.settings-section h3{
  font-size:var(--fs-11); text-transform:uppercase; letter-spacing:.08em;
  color:var(--tx-3); margin-bottom:var(--s-3); font-weight:650;
}
.settings-row{
  display:flex; align-items:center; justify-content:space-between;
  width:100%; padding:var(--s-2) 0; font-size:var(--fs-13); color:var(--tx-1);
}

.running-sheet{
  position:fixed; inset:0; z-index:var(--z-palette);
  display:none;
  opacity:0; pointer-events:none;
  transition:opacity var(--t-3) var(--e-out);
}
.running-sheet.is-open{ display:block; opacity:1; pointer-events:auto }
.running-sheet-scrim{ position:absolute; inset:0; background:rgba(0,0,0,.32) }
[data-theme="light"] .running-sheet-scrim{ background:rgba(24,22,18,.18) }
.running-sheet-panel{
  position:absolute; left:0; right:0; bottom:0;
  max-height:60vh; overflow-y:auto;
  background:var(--bg-float); border-top:var(--hair) solid var(--line-2);
  border-radius:var(--r-4) var(--r-4) 0 0; box-shadow:var(--e3), var(--edge);
  padding:var(--s-3) var(--s-4) calc(var(--s-4) + env(safe-area-inset-bottom));
  transform:translateY(0);
  transition:transform var(--t-3) var(--e-out);
}
.running-sheet:not(.is-open) .running-sheet-panel{ transform:translateY(100%) }
.running-sheet-handle{ width:36px; height:4px; border-radius:var(--r-f); background:var(--line-2); margin:0 auto var(--s-3) }
.running-sheet-row{
  display:flex; align-items:center; gap:var(--s-3);
  width:100%; padding:var(--s-3) var(--s-2); border-radius:var(--r-2);
  color:var(--tx-1); font-size:var(--fs-14);
}
.running-sheet-row:active{ background:var(--bg-press) }
.running-sheet-row .icon{ width:20px; height:20px; flex-shrink:0 }
.running-sheet-row span{ flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.running-sheet-row .live-dot{ flex-shrink:0 }
@media (min-width: 769px){ .running-sheet{ display:none !important } }

.info-sheet{ position:fixed; inset:0; z-index:var(--z-palette); display:none; opacity:0; pointer-events:none; transition:opacity var(--t-2) var(--e-out) }
.info-sheet.is-open{ display:flex; align-items:center; justify-content:center; opacity:1; pointer-events:auto }
.info-sheet-scrim{ position:absolute; inset:0; background:rgba(0,0,0,.32) }

const DEV = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || new URLSearchParams(location.search).has('dev');

function invariantWarn(scope, msg){
  if(DEV) console.warn(`[lx:invariant:${scope}]`, msg);
}

function esc(s){
  return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

class SafeHTML{
  constructor(value){ this.value = value; }
}

function raw(value){
  return new SafeHTML(String(value == null ? '' : value));
}

function html(strings, ...values){
  let out = strings[0];
  values.forEach((v, i) => {
    const safe = v instanceof SafeHTML ? v.value : esc(v == null ? '' : v);
    out += safe + strings[i + 1];
  });
  return out;
}

function isTypingTarget(el){
  if(!el) return false;

  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || !!el.isContentEditable;

const NS = 'lxos';
const SCHEMA_VERSION = 2;

const DEFAULTS = {
  version: SCHEMA_VERSION,
  theme: null,
  accent: 'amber',
  wallpaper: 'mesh-1',
  dockOrder: null,
  pinned: null,
  windowGeometry: {},
  tabGroups: {},
  recents: [],
  reduceMotion: null,
  reduceTransparency: null,
  showContinueRow: true,
  clockHour12: false,
  session: null
};

function migrate(data){
  if(!data || typeof data !== 'object') return { ...DEFAULTS };
  const fromVersion = typeof data.version === 'number' ? data.version : 0;
  let out = { ...data };
  if(fromVersion < 2){
    out.showContinueRow = typeof out.showContinueRow === 'boolean' ? out.showContinueRow : true;
    out.clockHour12 = typeof out.clockHour12 === 'boolean' ? out.clockHour12 : false;
    out.session = out.session || null;
  }
  return { ...DEFAULTS, ...out, version: SCHEMA_VERSION };
}

function load(){
  try{
    const raw = localStorage.getItem(NS);
    if(!raw) return { ...DEFAULTS };
    return migrate(JSON.parse(raw));
  }catch(err){
    return { ...DEFAULTS };
  }
}

function persist(data){
  try{
    localStorage.setItem(NS, JSON.stringify(data));
    return true;
  }catch(err){
    return false;
  }
}

class Store{
  constructor(){
    this.data = load();
    this.listeners = new Map();
  }

  get(key){
    return this.data[key];
  }

  set(key, value){
    this.data[key] = value;
    persist(this.data);
    this.emit(key, value);
    return value;
  }

  patch(key, patcher){
    const next = patcher(this.data[key]);
    return this.set(key, next);
  }

  on(key, fn){
    if(!this.listeners.has(key)) this.listeners.set(key, new Set());
    this.listeners.get(key).add(fn);
    return () => this.listeners.get(key)?.delete(fn);
  }

  emit(key, value){
    this.listeners.get(key)?.forEach(fn => fn(value));
    this.listeners.get('*')?.forEach(fn => fn(key, value));
  }

  systemTheme(){
    return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }

  effectiveTheme(){
    return this.data.theme || this.systemTheme();
  }

  applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta){
      const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-void').trim();
      if(bg) meta.setAttribute('content', bg);
    }
  }

  toggleTheme(){
    const next = this.effectiveTheme() === 'dark' ? 'light' : 'dark';
    this.set('theme', next);
    this.applyTheme(next);
  }

  setTheme(theme){
    this.set('theme', theme);
    this.applyTheme(theme || this.systemTheme());
  }

  setAccent(accent){
    this.set('accent', accent);
    document.documentElement.setAttribute('data-accent', accent);
  }

  setWallpaper(name){
    this.set('wallpaper', name);
    document.documentElement.setAttribute('data-wallpaper', name);
  }

  effectiveReduceTransparency(){
    if(this.data.reduceTransparency === true) return true;
    if(this.data.reduceTransparency === false) return false;
    return matchMedia('(prefers-reduced-transparency: reduce)').matches;
  }

  applyReduceTransparency(){
    document.documentElement.classList.toggle('reduce-transparency', this.effectiveReduceTransparency());
  }

  toggleReduceTransparency(){
    const next = !this.effectiveReduceTransparency();
    this.set('reduceTransparency', next);
    this.applyReduceTransparency();
    return next;
  }

  setReduceMotion(value){
    this.set('reduceMotion', value);
    document.documentElement.classList.toggle('reduce-motion', !!this.effectiveReduceMotion());
  }

  effectiveReduceMotion(){
    if(this.data.reduceMotion === true) return true;
    if(this.data.reduceMotion === false) return false;
    return matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  dockOrder(defaultOrder){
    return this.data.dockOrder && this.data.dockOrder.length ? this.data.dockOrder : defaultOrder;
  }

  setDockOrder(order){
    this.set('dockOrder', order);
  }

  pinned(defaultPinned){
    return this.data.pinned && this.data.pinned.length ? this.data.pinned : defaultPinned;
  }

  setPinned(list){
    this.set('pinned', list);
  }

  geometry(appId){
    return this.data.windowGeometry[appId] || null;
  }

  setGeometry(appId, geo){
    const next = { ...this.data.windowGeometry, [appId]: geo };
    this.set('windowGeometry', next);
  }

  deleteGeometry(appId){
    if(!(appId in this.data.windowGeometry)) return;
    const next = { ...this.data.windowGeometry };
    delete next[appId];
    this.set('windowGeometry', next);
  }

  recordRecent(id){
    const now = Date.now();
    const list = [...this.data.recents];
    const existing = list.find(r => r.id === id);
    if(existing){
      existing.count += 1;
      existing.lastUsed = now;
    }else{
      list.push({ id, count: 1, lastUsed: now });
    }
    this.set('recents', list);
  }

  frecencyScore(id){
    const entry = this.data.recents.find(r => r.id === id);
    if(!entry) return 0;
    const hoursAgo = (Date.now() - entry.lastUsed) / 36e5;
    const recencyWeight = 1 / (1 + hoursAgo / 12);
    return entry.count * 4 + recencyWeight * 20;
  }

  recentIds(limit = 4){
    return [...this.data.recents]
      .sort((a, b) => this.frecencyScore(b.id) - this.frecencyScore(a.id))
      .slice(0, limit)
      .map(r => r.id);
  }
}

const store = new Store();

const EASE = {
  out: 'cubic-bezier(.2,.9,.25,1)',
  in: 'cubic-bezier(.5,0,.9,.3)',
  io: 'cubic-bezier(.6,0,.2,1)'
};

const SPRING = {
  snappy: { duration:220, easing:EASE.out },
  standard: { duration:320, easing:EASE.out },
  gentle: { duration:480, easing:EASE.out }
};

const liveAnimations = new WeakMap();

function trackAnim(el, anim){
  if(!anim || typeof anim.cancel !== 'function') return anim;
  const list = liveAnimations.get(el) || [];
  list.push(anim);
  liveAnimations.set(el, list);
  const untrack = () => {
    const cur = liveAnimations.get(el);
    if(!cur) return;
    const i = cur.indexOf(anim);
    if(i !== -1) cur.splice(i, 1);
  };
  (anim.finished || Promise.resolve()).then(untrack).catch(untrack);
  return anim;
}

function cancelSpringsFor(el){
  const list = liveAnimations.get(el);
  if(!list) return;
  list.slice().forEach(a => { try{ a.cancel(); }catch(err){} });
  liveAnimations.set(el, []);
}

function reduced(){
  return store.effectiveReduceMotion();
}

function animate(el, keyframes, opts = {}){
  const last = Array.isArray(keyframes) ? keyframes[keyframes.length - 1] : keyframes;
  const { offset, ...finalProps } = last;

  if(reduced()){
    Object.assign(el.style, finalProps);
    return { finished: Promise.resolve(), cancel(){}, onfinish:null };
  }

  let anim;
  try{
    anim = el.animate(keyframes, { duration:170, easing:EASE.out, fill:'forwards', ...opts });
  }catch(err){

    Object.assign(el.style, finalProps);
    return { finished: Promise.resolve(), cancel(){}, onfinish:null };
  }

  trackAnim(el, anim);
  anim.finished.then(() => {
    try{
      anim.cancel();

      Object.assign(el.style, finalProps);
    }catch(err){}
  }).catch(() => {

    try{ Object.assign(el.style, finalProps); }catch(err){}
  });
  return anim;
}

function springTo(el, props, token = 'standard'){
  cancelSpringsFor(el);
  const allowed = new Set(['transform', 'opacity', 'filter']);
  const to = {};
  Object.keys(props).forEach(k => { if(allowed.has(k)) to[k] = props[k]; });
  return withWillChange(el, Object.keys(to).join(', '), () => animate(el, [to], SPRING[token] || SPRING.standard));
}

function withWillChange(el, props, run){
  el.style.willChange = props;
  const clear = () => { el.style.willChange = ''; };
  const anim = run();
  const finished = anim && anim.finished ? anim.finished : Promise.resolve();
  finished.then(clear).catch(clear);
  return anim;
}

let liveEl = null;

function announce(msg){

let activeMenuRoot = null;

function closeMenuLevel(level){
  if(!level) return;
  if(level.submenu) closeMenuLevel(level.submenu);
  level.cleanup?.();
  level.el.remove();
}

function closeAllMenus(){
  if(!activeMenuRoot) return;
  const invoker = activeMenuRoot.invoker;
  closeMenuLevel(activeMenuRoot);
  activeMenuRoot = null;
  if(invoker && document.contains(invoker)) invoker.focus();
}

function isPointInMenuTree(level, target){
  let l = level;
  while(l){
    if(l.el.contains(target)) return true;
    l = l.submenu;
  }
  return false;
}

function buildMenuItemNode(item){
  if(item.type === 'separator'){
    const el = document.createElement('div');
    el.className = 'menu-separator';
    el.setAttribute('role', 'separator');
    return { el };
  }
  if(item.type === 'label'){
    const el = document.createElement('div');
    el.className = 'menu-section-label';
    el.textContent = item.label;
    return { el };
  }
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'menu-item';
  el.tabIndex = -1;
  if(item.danger) el.classList.add('is-danger');
  if(item.disabled) el.setAttribute('aria-disabled', 'true');

  let role = 'menuitem';
  if(item.type === 'checkbox') role = 'menuitemcheckbox';
  else if(item.type === 'radio') role = 'menuitemradio';
  el.setAttribute('role', role);
  if(role !== 'menuitem') el.setAttribute('aria-checked', item.checked ? 'true' : 'false');
  if(item.type === 'submenu') el.setAttribute('aria-haspopup', 'menu');

  let iconInner = '';
  if(item.type === 'checkbox' || item.type === 'radio'){
    if(item.checked) iconInner = `<svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg>`;
  }else if(item.icon){
    iconInner = `<svg class="icon" aria-hidden="true"><use href="#i-${esc(item.icon)}"></use></svg>`;
  }
  el.innerHTML = html`<span class="menu-icon">${raw(iconInner)}</span><span class="menu-label">${item.label}</span>${raw(item.accel ? `<span class="menu-accel">${esc(item.accel)}</span>` : '')}${raw(item.type === 'submenu' ? `<svg class="icon menu-submenu-arrow" aria-hidden="true"><use href="#i-arrow-right"></use></svg>` : '')}`;
  return { el };
}

function positionMenuEl(el, { x, y, anchorEl, placement }){
  const pad = 8;
  const rect = el.getBoundingClientRect();
  let left, top, originX = 'left', originY = 'top';

  if(anchorEl){
    const a = anchorEl.getBoundingClientRect();
    const side = placement === 'submenu' ? 'right' : 'bottom';
    if(side === 'right'){
      left = a.right - 2;
      originX = 'left';
      if(left + rect.width > innerWidth - pad){ left = a.left - rect.width + 2; originX = 'right'; }
      top = a.top;
      if(top + rect.height > innerHeight - pad){ top = Math.max(pad, innerHeight - pad - rect.height); originY = 'bottom'; }
    }else{
      left = a.left;
      top = a.bottom + 4;
      originY = 'top';
      if(top + rect.height > innerHeight - pad){ top = a.top - rect.height - 4; originY = 'bottom'; }
      if(left + rect.width > innerWidth - pad){ left = Math.max(pad, innerWidth - pad - rect.width); originX = 'right'; }
    }
  }else{
    left = x; top = y;
    if(left + rect.width > innerWidth - pad){ left = Math.max(pad, x - rect.width); originX = 'right'; }
    if(top + rect.height > innerHeight - pad){ top = Math.max(pad, y - rect.height); originY = 'bottom'; }
  }
  left = Math.max(pad, Math.min(left, innerWidth - rect.width - pad));
  top = Math.max(pad, Math.min(top, innerHeight - rect.height - pad));
  el.style.left = `${left}px`;
  el.style.top = `${top}px`;
  el.style.transformOrigin = `${originY} ${originX}`;
}

function runMenuAction(level, item){
  closeAllMenus();
  item.action?.();
}

function setMenuActive(level, el){
  level.itemEls.forEach(({ el: e }) => e.classList.remove('is-active'));
  if(el){ el.classList.add('is-active'); el.focus(); }
  level.activeEl = el;
}

function openSubmenuFor(level, item, el){
  if(level.submenu) closeMenuLevel(level.submenu);
  level.submenu = createMenuLevel(item.items, {
    anchorEl: el, placement:'submenu', depth: level.depth + 1,
    invoker: level.invoker, parentLevel: level
  });
  activeMenuRoot._deepest = level.submenu;
}

function handleMenuKeydown(level, e){
  const enabled = level.itemEls.filter(x => !x.item.disabled);
  if(!enabled.length && e.key !== 'Escape' && e.key !== 'ArrowLeft') return;
  const idx = enabled.findIndex(x => x.el === level.activeEl);

  if(e.key === 'ArrowDown'){
    e.preventDefault();
    setMenuActive(level, enabled[(idx + 1) % enabled.length].el);
  }else if(e.key === 'ArrowUp'){
    e.preventDefault();
    setMenuActive(level, enabled[(idx - 1 + enabled.length) % enabled.length].el);
  }else if(e.key === 'Home'){
    e.preventDefault();
    setMenuActive(level, enabled[0].el);
  }else if(e.key === 'End'){
    e.preventDefault();
    setMenuActive(level, enabled[enabled.length - 1].el);
  }else if(e.key === 'ArrowRight'){
    const cur = enabled[idx];
    if(cur && cur.item.type === 'submenu'){
      e.preventDefault();
      openSubmenuFor(level, cur.item, cur.el);
      const sm = level.submenu;
      const first = sm.itemEls.find(x => !x.item.disabled);
      if(first) setMenuActive(sm, first.el);
    }
  }else if(e.key === 'ArrowLeft'){
    if(level.parentLevel){
      e.preventDefault();
      closeMenuLevel(level);
      level.parentLevel.submenu = null;
      setMenuActive(level.parentLevel, level.parentLevel.activeEl);
    }
  }else if(e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    const cur = enabled[idx];
    if(!cur) return;
    if(cur.item.type === 'submenu'){
      openSubmenuFor(level, cur.item, cur.el);
      const sm = level.submenu;
      const first = sm.itemEls.find(x => !x.item.disabled);
      if(first) setMenuActive(sm, first.el);
    }else{
      runMenuAction(level, cur.item);
    }
  }else if(e.key === 'Escape'){
    e.preventDefault();
    if(level.parentLevel){
      closeMenuLevel(level);
      level.parentLevel.submenu = null;
      setMenuActive(level.parentLevel, level.parentLevel.activeEl);
    }else{
      closeAllMenus();
    }
  }else if(e.key === 'Tab'){
    e.preventDefault();
  }else if(e.key.length === 1 && /[a-z0-9]/i.test(e.key)){
    clearTimeout(level.typeaheadTimer);
    level.typeaheadBuf = (level.typeaheadBuf || '') + e.key.toLowerCase();
    level.typeaheadTimer = setTimeout(() => { level.typeaheadBuf = ''; }, 600);
    const match = enabled.find(x => x.item.label?.toLowerCase().startsWith(level.typeaheadBuf));
    if(match) setMenuActive(level, match.el);
  }
}

function createMenuLevel(items, { x, y, anchorEl, placement, depth, invoker, parentLevel }){
  const el = document.createElement('div');
  el.className = 'menu';
  el.setAttribute('role', 'menu');
  el.style.transformOrigin = 'top left';

  const level = { el, items, depth, invoker, parentLevel, submenu:null, itemEls:[], activeEl:null, typeaheadBuf:'' };

  items.forEach(item => {
    const { el: itemEl } = buildMenuItemNode(item);
    el.appendChild(itemEl);
    if(item.type !== 'separator' && item.type !== 'label'){
      level.itemEls.push({ item, el: itemEl });
      itemEl.addEventListener('pointerenter', () => {
        if(item.type !== 'submenu' && level.submenu){ closeMenuLevel(level.submenu); level.submenu = null; }
        setMenuActive(level, itemEl);
        if(item.type === 'submenu' && level.submenu === null) openSubmenuFor(level, item, itemEl);
      });
      itemEl.addEventListener('click', e => {
        e.stopPropagation();
        if(item.disabled) return;
        if(item.type === 'submenu'){
          openSubmenuFor(level, item, itemEl);
          const sm = level.submenu;
          const first = sm.itemEls.find(x => !x.item.disabled);
          if(first) setMenuActive(sm, first.el);
        }else{
          runMenuAction(level, item);
        }
      });
    }
  });

  document.body.appendChild(el);
  positionMenuEl(el, { x, y, anchorEl, placement });
  if(!reduced()) requestAnimationFrame(() => el.classList.add('is-open'));
  else el.classList.add('is-open');

  el.addEventListener('keydown', e => handleMenuKeydown(level, e));

  if(depth === 0){
    const onDocDown = e => { if(!isPointInMenuTree(level, e.target)) closeAllMenus(); };
    const onBlur = () => closeAllMenus();
    const onScroll = () => closeAllMenus();
    const onResize = () => closeAllMenus();
    document.addEventListener('pointerdown', onDocDown, true);
    addEventListener('blur', onBlur);
    addEventListener('scroll', onScroll, true);
    addEventListener('resize', onResize);
    level.cleanup = () => {
      document.removeEventListener('pointerdown', onDocDown, true);
      removeEventListener('blur', onBlur);
      removeEventListener('scroll', onScroll, true);
      removeEventListener('resize', onResize);
    };
  }

  const firstEnabled = level.itemEls.find(x => !x.item.disabled);
  if(firstEnabled) setMenuActive(level, firstEnabled.el);

  return level;
}

function openMenu({ x, y, anchorEl, items, placement, invoker } = {}){
  closeAllMenus();
  const root = createMenuLevel(items, {
    x, y, anchorEl, placement, depth:0,
    invoker: invoker || document.activeElement, parentLevel:null
  });
  activeMenuRoot = root;
  return root;
}

function bindLongPress(el, handler){
  let timer = null, startX = 0, startY = 0, active = false;
  const cancel = () => { clearTimeout(timer); active = false; };
  el.addEventListener('pointerdown', e => {
    if(e.pointerType !== 'touch') return;
    startX = e.clientX; startY = e.clientY;
    active = true;
    timer = setTimeout(() => {
      if(!active) return;
      active = false;
      handler(e);
    }, 480);
  });
  el.addEventListener('pointermove', e => {
    if(!active) return;
    if(Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8) cancel();
  });
  el.addEventListener('pointerup', cancel);
  el.addEventListener('pointercancel', cancel);
}

const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),[tabindex]:not([tabindex="-1"])';

function isRendered(el){
  return el.getClientRects().length > 0;
}

function trapFocus(container, opts = {}){

  const restoreTo = opts.restoreFocusTo || null;

  function getFocusable(){
    return Array.from(container.querySelectorAll(FOCUSABLE)).filter(isRendered);
  }

  function onKeydown(e){
    if(e.key !== 'Tab') return;
    const items = getFocusable();
    if(!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    if(e.shiftKey && document.activeElement === first){
      e.preventDefault(); last.focus();
    }else if(!e.shiftKey && document.activeElement === last){
      e.preventDefault(); first.focus();
    }
  }

  container.addEventListener('keydown', onKeydown);
  const items = getFocusable();
  if(items.length) items[0].focus();

  return function release(){
    container.removeEventListener('keydown', onKeydown);
    if(restoreTo && document.contains(restoreTo)) restoreTo.focus();
  };
}

function rovingTabindex(container, itemSelector, opts = {}){
  const orientation = opts.orientation || 'horizontal';
  const fwdKey = orientation === 'horizontal' ? 'ArrowRight' : 'ArrowDown';
  const bwdKey = orientation === 'horizontal' ? 'ArrowLeft' : 'ArrowUp';

  function items(){
    return Array.from(container.querySelectorAll(itemSelector));
  }

  function setActive(el){
    items().forEach(i => { i.tabIndex = i === el ? 0 : -1; });
  }

  const initial = items();
  if(initial.length) setActive(initial[0]);

  container.addEventListener('keydown', e => {
    const list = items();
    const idx = list.indexOf(document.activeElement);
    if(idx === -1) return;
    let next = null;
    if(e.key === fwdKey) next = list[(idx + 1) % list.length];
    else if(e.key === bwdKey) next = list[(idx - 1 + list.length) % list.length];
    else if(e.key === 'Home') next = list[0];
    else if(e.key === 'End') next = list[list.length - 1];
    if(next){ e.preventDefault(); setActive(next); next.focus(); }
  });

  return { setActive, items };
}

const LOAD_GRACE_MS = 12000;
const MAX_CACHED_FRAMES = APPS.length;
const SANDBOX = 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals';

function originOf(url){
  try{ return new URL(url).origin; }catch(err){ return null; }
}

class EmbedManager extends EventTarget{
  constructor(){
    super();
    this.frames = new Map();
    this.order = [];
    this.isProtected = () => false;
    window.addEventListener('message', this.handleMessage.bind(this));
  }

  handleMessage(e){
    const data = e.data;
    if(!data || typeof data !== 'object' || !data.t) return;
    const entry = [...this.frames.entries()].find(([, f]) => f.iframe.contentWindow === e.source);
    if(!entry) return;
    const [appId, frame] = entry;

    const appEntry = findById(appId);
    const expected = appEntry ? originOf(appEntry.url) : null;
    if(!expected || e.origin !== expected) return;
    if(data.t === 'lx:ready'){
      frame.handshake = true;
      frame.ready = true;
      clearTimeout(frame.timeout);
      this.pushTheme(appId);
      this.dispatchEvent(new CustomEvent('status', { detail:{ appId, status:'live', title:data.title } }));
    }else if(data.t === 'lx:palette'){
      this.dispatchEvent(new CustomEvent('request-palette', { detail:{ appId } }));
    }else if(data.t === 'lx:title' && data.title){
      this.dispatchEvent(new CustomEvent('status', { detail:{ appId, status:'title', title:data.title } }));
    }
  }

  has(appId){
    return this.frames.has(appId);
  }

  mount(appEntry, container){
    let frame = this.frames.get(appEntry.id);
    if(frame){
      this.touch(appEntry.id);
      if(frame.iframe.parentElement !== container) container.appendChild(frame.iframe);
      return frame;
    }
    this.evictIfNeeded();
    const iframe = document.createElement('iframe');
    iframe.className = 'lx-frame';
    iframe.loading = 'eager';

    iframe.referrerPolicy = 'strict-origin-when-cross-origin';
    iframe.setAttribute('sandbox', SANDBOX);

    iframe.setAttribute('allow', 'clipboard-read; clipboard-write; fullscreen');
    iframe.title = appEntry.name;
    frame = { iframe, ready:false, shown:false, handshake:false, id:appEntry.id, timeout:null, started:false };

    iframe.addEventListener('load', () => {
      if(frame.shown) return;
      frame.shown = true;
      clearTimeout(frame.timeout);
      this.dispatchEvent(new CustomEvent('status', { detail:{ appId:appEntry.id, status:'shown' } }));
    });

    iframe.addEventListener('error', () => {
      if(frame.shown) return;
      clearTimeout(frame.timeout);
      this.dispatchEvent(new CustomEvent('status', { detail:{ appId:appEntry.id, status:'timeout' } }));
    });

    container.appendChild(iframe);
    this.frames.set(appEntry.id, frame);
    this.order.push(appEntry.id);

    this.activate(appEntry);
    return frame;
  }

  activate(appEntry){
    const frame = this.frames.get(appEntry.id);
    if(!frame || frame.started) return;
    frame.started = true;
    frame.iframe.src = appEntry.url;
    frame.timeout = setTimeout(() => {
      if(!frame.shown){
        this.dispatchEvent(new CustomEvent('status', { detail:{ appId:appEntry.id, status:'timeout' } }));
      }
    }, LOAD_GRACE_MS);
  }

  reset(appId){
    const frame = this.frames.get(appId);
    if(!frame) return;
    clearTimeout(frame.timeout);
    frame.shown = false;
    frame.timeout = setTimeout(() => {
      if(!frame.shown){
        this.dispatchEvent(new CustomEvent('status', { detail:{ appId, status:'timeout' } }));
      }
    }, LOAD_GRACE_MS);
  }

  touch(id){
    this.order = this.order.filter(x => x !== id);
    this.order.push(id);
  }

  evictIfNeeded(){
    if(this.order.length < MAX_CACHED_FRAMES) return;
    const evictable = this.order.find(id => !this.isProtected(id));
    if(!evictable) return;
    const frame = this.frames.get(evictable);
    if(frame){
      clearTimeout(frame.timeout);
      frame.iframe.remove();
    }
    this.frames.delete(evictable);
    this.order = this.order.filter(x => x !== evictable);
  }

  release(appId){
    const frame = this.frames.get(appId);
    if(!frame) return;
    clearTimeout(frame.timeout);
    frame.iframe.remove();
    this.frames.delete(appId);
    this.order = this.order.filter(x => x !== appId);
  }

  pushTheme(appId){
    const frame = this.frames.get(appId);
    if(!frame || !frame.iframe.contentWindow) return;
    const appEntry = findById(appId);
    const target = appEntry ? originOf(appEntry.url) : null;
    if(!target) return;
    const theme = document.documentElement.getAttribute('data-theme');
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--sig').trim();

    frame.iframe.contentWindow.postMessage({ t:'lx:theme', theme, accent }, target);
  }

  broadcastTheme(){
    this.frames.forEach((_, id) => this.pushTheme(id));
  }

  isLive(appId){
    return !!this.frames.get(appId)?.ready;
  }
}

function renderFallback(appEntry){
  const wrap = document.createElement('div');
  wrap.className = 'fallback-card';
  const origin = originOf(appEntry.url) || '';
  const hostname = origin ? origin.replace(/^https?:\/\//, '') : appEntry.url;
  wrap.innerHTML = html`
    <img class="fallback-poster" src="${appEntry.poster}" alt="" />
    <div class="fallback-body">
      <div class="fallback-id">
        <img class="fallback-favicon" data-favicon src="${origin}/favicon.ico" alt="" />
        <span class="mono fallback-host">${hostname}</span>
      </div>
      <p class="fallback-msg">This app can't be shown inline here.</p>
      <a class="btn-sig" href="${appEntry.url}" target="_blank" rel="noopener noreferrer">
        <svg class="icon"><use href="#i-external"></use></svg>
        Open externally
      </a>
    </div>`;

  const favicon = wrap.querySelector('[data-favicon]');
  favicon?.addEventListener('error', () => { favicon.style.display = 'none'; });
  return wrap;
}

function renderPaneLoading(label){
  const wrap = document.createElement('div');
  wrap.className = 'win-loading';
  wrap.setAttribute('data-pane-loading', '');
  wrap.innerHTML = label
    ? html`<div class="win-loading-body"><span class="spinner" aria-hidden="true"></span><span class="win-loading-label">${label}</span></div>`
    : '<span class="spinner" aria-hidden="true"></span>';
  return wrap;
}

const MIN_W = 340;
const MIN_H = 220;
const EDGE_ZONE = 28;
const CASCADE = 28;

let dockReserve = 0;

function updateDockReserve(){
  const wrap = document.querySelector('.dock-wrap');
  if(!wrap) return;
  const rect = wrap.getBoundingClientRect();
  const visible = getComputedStyle(wrap).display !== 'none' && rect.height > 0;
  const next = visible ? Math.round((innerHeight - rect.top) + 8) : 0;
  if(next === dockReserve) return;
  dockReserve = next;
  document.documentElement.style.setProperty('--dock-reserve', dockReserve + 'px');
}

function clampGeo(geo){
  const w = Math.max(MIN_W, Math.min(geo.w, innerWidth - 16));
  const maxH = Math.max(MIN_H, innerHeight - dockReserve - 16);
  const h = Math.max(MIN_H, Math.min(geo.h, maxH));
  const x = Math.max(4, Math.min(geo.x, innerWidth - w - 4));
  const y = Math.max(4, Math.min(geo.y, innerHeight - dockReserve - h - 4));
  return { x, y, w, h };
}

function applyFrameStyles(el, frame){
  el.style.transform = `translate3d(${frame.x}px, ${frame.y}px, 0)`;
  el.style.width = frame.w + 'px';
  el.style.height = frame.h + 'px';
}

function openFlipAnimation(el, flipFrom, frame){
  if(flipFrom && flipFrom.width && flipFrom.height && !reduced()){
    const sx = Math.max(0.12, flipFrom.width / frame.w);
    const sy = Math.max(0.12, flipFrom.height / frame.h);
    const dx = (flipFrom.left + flipFrom.width / 2) - (frame.x + frame.w / 2);
    const dy = (flipFrom.top + flipFrom.height / 2) - (frame.y + frame.h / 2);
    return animate(el, [
      { opacity:0, transform:`translate3d(${frame.x + dx}px, ${frame.y + dy}px, 0) scale(${sx}, ${sy})` },
      { opacity:1, transform:`translate3d(${frame.x}px, ${frame.y}px, 0) scale(1, 1)` }
    ], { duration:260, easing:EASE.out });
  }
  return animate(el, [
    { opacity:0, transform:`translate3d(${frame.x}px, ${frame.y}px, 0) scale(.98)` },
    { opacity:1, transform:`translate3d(${frame.x}px, ${frame.y}px, 0) scale(1)` }
  ], { duration:170 });
}

class WindowManager extends EventTarget{
  constructor(root, embed){
    super();
    this.root = root;
    this.embed = embed;
    this.wins = new Map();
    this.liveState = new Map();
    this.order = [];
    this.zBase = 20;
    this.openCount = 0;
    this.embed.addEventListener('status', e => this.onEmbedStatus(e.detail));

    this.embed.isProtected = id => {
      const win = this.findWin(id);
      return !!win && !win.minimized;
    };
    window.addEventListener('resize', () => this.wins.forEach((w, id) => this.reflow(id)));
  }

  get focusedId(){
    return this.order[this.order.length - 1] || null;
  }

  isOpen(id){
    const win = this.findWin(id);
    return !!win && !win.minimized;
  }

  findWin(appId){
    return this.wins.get(appId) || [...this.wins.values()].find(w => w.tabs.includes(appId)) || null;
  }

  raise(id){
    const i = this.order.indexOf(id);
    if(i !== -1) this.order.splice(i, 1);
    this.order.push(id);
  }

  normalizeSavedGeometry(saved){
    if(!saved) return null;
    if(saved.frame) return saved;
    if(typeof saved.x === 'number'){

      return { frame:{ x:saved.x, y:saved.y, w:saved.w, h:saved.h }, restoreFrame:null, maximized: !!saved.maximized };
    }
    return null;
  }

  open(appEntry, opts = {}){
    let win = this.findWin(appEntry.id);
    if(win){
      if(win.minimized) this.restore(win.id);
      else this.focus(win.id);
      if(win.activeTab !== appEntry.id) this.showTab(win, appEntry.id);
      return win;
    }
    return this.create(appEntry, opts.flipFrom);
  }

  addTab(win, appEntry){
    if(!win) return null;
    if(win.tabs.includes(appEntry.id)){
      this.showTab(win, appEntry.id);
    }else{
      win.tabs.push(appEntry.id);
      this.mountTab(win, appEntry);
      this.showTab(win, appEntry.id);
    }
    this.focus(win.id);
    store.recordRecent(appEntry.id);
    this.checkInvariants('addTab');
    return win;
  }

  create(appEntry, flipFrom){
    const saved = this.normalizeSavedGeometry(store.geometry(appEntry.id));
    const base = saved ? saved.frame : {
      x: Math.round(innerWidth / 2 - 440 + (this.openCount % 6) * CASCADE),
      y: Math.round(innerHeight / 2 - 300 + (this.openCount % 6) * CASCADE),
      w: Math.min(880, innerWidth - 80),
      h: Math.min(600, innerHeight - 140)
    };
    this.openCount++;
    const frame = clampGeo(base);

    const el = document.createElement('section');
    el.className = 'win';
    el.dataset.app = appEntry.id;
    el.setAttribute('role', 'group');
    el.setAttribute('aria-label', appEntry.name);
    applyFrameStyles(el, frame);

    el.innerHTML = html`
      <div class="win-tb" data-drag tabindex="-1">
        <button type="button" class="vh" data-focus-content>Jump to ${appEntry.name} content</button>
        <div class="win-title">
          <svg class="icon" aria-hidden="true"><use href="#i-${appEntry.icon}"></use></svg>
          <span class="win-name">${appEntry.name}</span>
          <span class="live-dot" data-live></span>
        </div>
        <div class="win-tabs" data-tabs hidden></div>
        <div class="win-ctrl">
          <button class="wc wc-min" data-min aria-label="Minimise ${appEntry.name}">
            <svg class="icon"><use href="#i-minus"></use></svg>
          </button>
          <button class="wc wc-max" data-max aria-label="Maximise ${appEntry.name}">
            <svg class="icon"><use href="#i-expand"></use></svg>
          </button>
          <button class="wc wc-close" data-close aria-label="Close ${appEntry.name}">
            <svg class="icon"><use href="#i-close"></use></svg>
          </button>
        </div>
      </div>
      <div class="win-body" data-body>
        <div class="win-loading" data-loading>
          <span class="spinner" aria-hidden="true"></span>
        </div>
      </div>
      <a class="win-escape" href="${appEntry.url}" target="_blank" rel="noopener noreferrer" aria-label="Open ${appEntry.name} in a new tab">
        <svg class="icon"><use href="#i-external"></use></svg>
      </a>
      ${raw(['n','s','e','w','ne','nw','se','sw'].map(d => `<div class="rh rh-${d}" data-resize="${d}"></div>`).join(''))}
    `;

    this.root.appendChild(el);

    const win = {
      id: appEntry.id, app: appEntry, el,
      frame, restoreFrame: saved ? saved.restoreFrame : null,
      maximized: !!(saved && saved.maximized), minimized:false,
      tabs: [appEntry.id], activeTab: appEntry.id, panes: new Map()
    };
    this.wins.set(appEntry.id, win);

    this.mountTab(win, appEntry);
    this.wireChrome(win);
    this.bindDrag(win);
    this.bindResize(win);

    this.focus(appEntry.id);

    if(win.maximized) this.applyMaximize(win, true);
    else openFlipAnimation(el, flipFrom, frame);

    store.recordRecent(appEntry.id);
    announce(`${appEntry.name} opened`);
    this.dispatchEvent(new CustomEvent('winopen', { detail:{ id: appEntry.id } }));
    this.checkInvariants('create');
    return win;
  }

  mountTab(win, appEntry){
    const body = win.el.querySelector('[data-body]');
    const pane = document.createElement('div');
    pane.className = 'tab-pane';
    pane.dataset.pane = appEntry.id;
    pane.tabIndex = -1;
    body.appendChild(pane);
    win.panes.set(appEntry.id, pane);

    const loading = win.el.querySelector('[data-loading]');
    if(appEntry.embed === false){
      pane.appendChild(renderFallback(appEntry));
      loading?.remove();
      this.setLive(appEntry.id, null);
      return;
    }
    this.setLive(appEntry.id, 'loading');
    const frame = this.embed.mount(appEntry, pane);
    if(frame.shown){ loading?.remove(); this.setLive(appEntry.id, 'embedded'); }
  }

  onEmbedStatus({ appId, status, title }){
    const win = this.findWin(appId);
    if(!win) return;
    const loading = win.el.querySelector('[data-loading]');
    const paneLoading = win.panes.get(appId)?.querySelector('[data-pane-loading]');
    if(status === 'live'){
      loading?.remove();
      paneLoading?.remove();
      this.setLive(appId, 'embedded');
      if(title && appId === win.activeTab){
        win.el.querySelector('.win-name').textContent = title;
      }
    }else if(status === 'shown'){
      loading?.remove();
      paneLoading?.remove();
      this.setLive(appId, 'embedded');
    }else if(status === 'timeout'){
      loading?.remove();
      paneLoading?.remove();
      const pane = win.panes.get(appId);
      if(pane && !pane.querySelector('.fallback-card')){
        const appEntry = findById(appId);
        if(appEntry) pane.appendChild(renderFallback(appEntry));
      }
      this.setLive(appId, 'blocked');
    }
  }

  setLive(appId, state){
    this.liveState.set(appId, state);
    const win = this.findWin(appId);
    if(!win || win.activeTab !== appId) return;
    const dot = win.el.querySelector('[data-live]');
    if(!dot) return;
    if(state){ dot.hidden = false; dot.dataset.state = state; }
    else{ dot.hidden = true; delete dot.dataset.state; }
  }

  showTab(win, appId){
    if(!win.tabs.includes(appId)) return;
    win.activeTab = appId;
    win.panes.forEach((pane, id) => { pane.hidden = id !== appId; });
    const appEntry = findById(appId);
    if(appEntry){
      const iconUse = win.el.querySelector('.win-title .icon use');
      if(iconUse) iconUse.setAttribute('href', `#i-${appEntry.icon}`);
      const nameEl = win.el.querySelector('.win-name');
      if(nameEl) nameEl.textContent = appEntry.name;
      const escapeLink = win.el.querySelector('.win-escape');
      if(escapeLink){
        escapeLink.setAttribute('href', appEntry.url);
        escapeLink.setAttribute('aria-label', `Open ${appEntry.name} in a new tab`);
      }
      const focusBtn = win.el.querySelector('[data-focus-content]');
      if(focusBtn) focusBtn.textContent = `Jump to ${appEntry.name} content`;
    }
    const dot = win.el.querySelector('[data-live]');
    if(dot){
      const state = this.liveState.get(appId);
      if(state){ dot.hidden = false; dot.dataset.state = state; }
      else{ dot.hidden = true; delete dot.dataset.state; }
    }
    this.renderTabStrip(win);
    this.dispatchEvent(new CustomEvent('tabchange', { detail:{ winId: win.id, appId } }));
  }

  renderTabStrip(win){
    const strip = win.el.querySelector('[data-tabs]');
    if(!strip) return;
    if(win.tabs.length <= 1){
      strip.hidden = true;
      strip.innerHTML = '';
      return;
    }
    strip.hidden = false;
    strip.innerHTML = '';
    win.tabs.forEach(appId => {
      const appEntry = findById(appId);
      if(!appEntry) return;

      const wrap = document.createElement('div');
      wrap.className = `win-tab-wrap${appId === win.activeTab ? ' is-active' : ''}`;
      wrap.dataset.tab = appId;
      wrap.addEventListener('mousedown', e => {
        if(e.button === 1){ e.preventDefault(); this.closeTab(win.id, appId); }
      });
      wrap.addEventListener('contextmenu', e => {
        e.preventDefault();
        e.stopPropagation();
        this.onTabContextMenu?.(win, appId, e.clientX, e.clientY);
      });

      const select = document.createElement('button');
      select.type = 'button';
      select.className = 'win-tab';
      select.innerHTML = html`<svg class="icon"><use href="#i-${appEntry.icon}"></use></svg><span>${appEntry.name}</span>`;
      select.addEventListener('click', () => this.showTab(win, appId));

      const close = document.createElement('button');
      close.type = 'button';
      close.className = 'win-tab-close';
      close.setAttribute('aria-label', `Close ${appEntry.name} tab`);
      close.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>';
      close.addEventListener('click', e => {
        e.stopPropagation();
        this.closeTab(win.id, appId);
      });

      wrap.appendChild(select);
      wrap.appendChild(close);
      strip.appendChild(wrap);
    });
  }

  mergeInto(sourceWinId, targetWinId){
    if(sourceWinId === targetWinId) return;
    const source = this.wins.get(sourceWinId);
    const target = this.wins.get(targetWinId);
    if(!source || !target) return;
    const statefulApp = source.tabs.map(findById).find(a => a?.stateful);
    if(statefulApp){
      announce(`Can't merge — ${statefulApp.name} would lose its state`);
      const tb = target.el.querySelector('.win-tb');
      if(tb && !reduced()){
        animate(tb, [
          { transform:'translateX(0)' },
          { transform:'translateX(-4px)' },
          { transform:'translateX(4px)' },
          { transform:'translateX(0)' }
        ], { duration:220, easing:EASE.out });
      }
      return;
    }
    const body = target.el.querySelector('[data-body]');
    source.tabs.forEach(appId => {
      const pane = source.panes.get(appId);

      if(target.panes.has(appId) && target.panes.get(appId) !== pane){
        target.panes.get(appId)?.remove();
      }
      if(pane){
        const appEntry = findById(appId);
        if(appEntry?.embed !== false && this.embed.frames.has(appId)){
          this.embed.reset(appId);
          this.setLive(appId, 'loading');
          pane.appendChild(renderPaneLoading(`Reloading ${appEntry.name}…`));
        }
        body.appendChild(pane);
        target.panes.set(appId, pane);
      }
      if(!target.tabs.includes(appId)) target.tabs.push(appId);
    });
    source._snapPreviewEl?.remove();
    source._resizeGhostEl?.remove();
    source.el.remove();
    this.wins.delete(sourceWinId);
    this.order = this.order.filter(x => x !== sourceWinId);
    store.deleteGeometry(sourceWinId);
    this.showTab(target, source.activeTab);
    this.focus(targetWinId);
    announce(`${source.app.name} merged into ${target.app.name} window`);
    this.checkInvariants('mergeInto');
  }

  closeTab(winId, appId){
    const win = this.wins.get(winId);
    if(!win) return;
    if(win.tabs.length <= 1){ this.close(winId); return; }

    const wasActive = win.activeTab === appId;
    const pane = win.panes.get(appId);

    const closedName = findById(appId)?.name || appId;

    const finishRemoval = () => {
      this.embed.release(appId);
      if(pane) pane.remove();
      win.panes.delete(appId);
      win.tabs = win.tabs.filter(t => t !== appId);

      if(wasActive){
        this.showTab(win, win.tabs[win.tabs.length - 1]);
      }else{
        this.renderTabStrip(win);
      }

      if(winId === appId){
        const newId = win.tabs[0];
        this.wins.delete(winId);
        win.id = newId;
        win.app = findById(newId) || win.app;
        win.el.dataset.app = newId;
        this.wins.set(newId, win);
        this.order = this.order.map(x => x === winId ? newId : x);
        const geo = store.geometry(winId);
        if(geo) store.setGeometry(newId, geo);
        store.deleteGeometry(winId);
      }

      this.dispatchEvent(new CustomEvent('winclose', { detail:{ id: appId } }));
      announce(`${closedName} tab closed`);
      this.checkInvariants('closeTab');
    };

    if(!wasActive || reduced() || !pane){
      finishRemoval();
      return;
    }

    const anim = animate(pane, [
      { opacity:1, transform:'scale(1)' },
      { opacity:0, transform:'scale(.97)' }
    ], { duration:130, easing:EASE.in });
    (anim.finished || Promise.resolve()).then(finishRemoval).catch(finishRemoval);
  }

  detachTab(winId, appId){
    const win = this.wins.get(winId);
    if(!win || win.tabs.length <= 1) return null;
    const appEntry = findById(appId);
    if(!appEntry) return null;
    if(appEntry.stateful){
      announce(`Can't detach — ${appEntry.name} would lose its state`);
      const tb = win.el.querySelector('.win-tb');
      if(tb && !reduced()){
        animate(tb, [
          { transform:'translateX(0)' },
          { transform:'translateX(-4px)' },
          { transform:'translateX(4px)' },
          { transform:'translateX(0)' }
        ], { duration:220, easing:EASE.out });
      }
      return null;
    }
    const wasActive = win.activeTab === appId;
    const pane = win.panes.get(appId);
    this.embed.release(appId);
    pane?.remove();
    win.panes.delete(appId);
    win.tabs = win.tabs.filter(t => t !== appId);
    if(wasActive) this.showTab(win, win.tabs[win.tabs.length - 1]);
    else this.renderTabStrip(win);
    if(winId === appId){
      const newId = win.tabs[0];
      this.wins.delete(winId);
      win.id = newId;
      win.app = findById(newId) || win.app;
      win.el.dataset.app = newId;
      this.wins.set(newId, win);
      this.order = this.order.map(x => x === winId ? newId : x);
      const geo = store.geometry(winId);
      if(geo) store.setGeometry(newId, geo);
      store.deleteGeometry(winId);
    }
    this.checkInvariants('detachTab');
    return this.create(appEntry);
  }

  closeOtherTabs(winId, keepAppId){
    const win = this.wins.get(winId);
    if(!win) return;
    [...win.tabs].filter(id => id !== keepAppId).forEach(id => {
      const current = this.findWin(keepAppId);
      if(current) this.closeTab(current.id, id);
    });
  }

  wireChrome(win){
    const el = win.el;
    el.addEventListener('pointerdown', () => this.focus(win.id), { capture:true });
    el.querySelector('[data-close]').addEventListener('click', () => this.close(win.id));
    el.querySelector('[data-min]').addEventListener('click', () => this.minimize(win.id));
    el.querySelector('[data-max]').addEventListener('click', () => this.toggleMaximize(win.id));
    el.querySelector('[data-drag]').addEventListener('dblclick', e => {
      if(e.target.closest('.wc')) return;
      this.toggleMaximize(win.id);
    });
    el.querySelector('[data-drag]').addEventListener('contextmenu', e => {
      if(e.target.closest('input, textarea, [contenteditable], .win-tab-wrap')) return;
      e.preventDefault();
      this.onTitlebarContextMenu?.(win, e.clientX, e.clientY);
    });

    const focusBtn = el.querySelector('[data-focus-content]');
    focusBtn?.addEventListener('click', () => {
      const pane = win.panes.get(win.activeTab);
      const iframe = pane?.querySelector('iframe');
      (iframe || pane)?.focus();
    });
  }

  focus(id){
    if(this.focusedId === id) return;
    this.raise(id);
    this.reorderZ();
    this.dispatchEvent(new CustomEvent('focuschange', { detail:{ id } }));
    this.checkInvariants('focus');
  }

  reorderZ(){
    this.order.forEach((id, i) => {
      const win = this.wins.get(id);
      if(!win) return;
      win.el.style.zIndex = this.zBase + i;
      const isFocused = i === this.order.length - 1;
      win.el.classList.toggle('is-focused', isFocused);
      win.el.classList.toggle('is-unfocused', !isFocused);
    });
  }

  persistGeometry(win){

    store.setGeometry(win.id, {
      frame: { ...win.frame },
      restoreFrame: win.restoreFrame ? { ...win.restoreFrame } : null,
      maximized: win.maximized
    });
  }

  close(id){
    const win = this.wins.get(id);
    if(!win) return;
    const finish = () => {
      win.tabs.forEach(t => this.embed.release(t));

      win._snapPreviewEl?.remove();
      win._resizeGhostEl?.remove();
      win.el.remove();
      this.wins.delete(id);
      this.order = this.order.filter(x => x !== id);
      this.reorderZ();
      announce(`${win.app.name} closed`);
      win.tabs.forEach(t => this.dispatchEvent(new CustomEvent('winclose', { detail:{ id: t } })));
      this.checkInvariants('close');
    };
    const baseTransform = win.el.style.transform || 'translate3d(0,0,0)';
    const anim = animate(win.el, [
      { opacity:1, transform: baseTransform },
      { opacity:0, transform:`${baseTransform} scale(.97)` }
    ], { duration:160, easing:EASE.in });
    (anim.finished || Promise.resolve()).then(finish).catch(finish);
  }

  closeFocused(){
    if(this.focusedId) this.close(this.focusedId);
  }

  forceNew(appEntry, flipFrom){
    const existing = this.findWin(appEntry.id);
    if(existing){
      if(existing.tabs.length > 1){
        this.closeTab(existing.id, appEntry.id);
      }else{
        existing.tabs.forEach(t => this.embed.release(t));
        existing._snapPreviewEl?.remove();
        existing._resizeGhostEl?.remove();
        existing.el.remove();
        this.wins.delete(existing.id);
        this.order = this.order.filter(x => x !== existing.id);

        existing.tabs.forEach(t => this.dispatchEvent(new CustomEvent('winclose', { detail:{ id: t } })));
      }
      store.deleteGeometry(appEntry.id);
    }
    return this.create(appEntry, flipFrom);
  }

  minimize(id){
    const win = this.wins.get(id);
    if(!win) return;
    win.minimized = true;
    win.el.classList.add('is-minimized');
    this.order = this.order.filter(x => x !== id);
    this.reorderZ();
    announce(`${win.app.name} minimised`);
    this.dispatchEvent(new CustomEvent('winminimize', { detail:{ id } }));
    this.checkInvariants('minimize');
  }

  minimizeFocused(){
    if(this.focusedId) this.minimize(this.focusedId);
  }

  minimizeAll(){
    [...this.wins.values()].forEach(win => { if(!win.minimized) this.minimize(win.id); });
  }

  restoreAll(){
    [...this.wins.values()].forEach(win => { if(win.minimized) this.restore(win.id); });
  }

  anyMinimized(){
    return [...this.wins.values()].some(win => win.minimized);
  }

  bringAllToFront(){
    this.restoreAll();
    if(this.order.length) this.focus(this.order[this.order.length - 1]);
  }

  restore(id){
    const win = this.wins.get(id);
    if(!win) return;
    win.minimized = false;
    win.el.classList.remove('is-minimized');

    this.focus(id);
    this.remountIfEvicted(win);
    store.recordRecent(id);
    this.dispatchEvent(new CustomEvent('winrestore', { detail:{ id } }));
    this.checkInvariants('restore');
  }

  remountIfEvicted(win){
    win.tabs.forEach(appId => {
      if(this.embed.has(appId)) return;
      const appEntry = findById(appId);
      const pane = win.panes.get(appId);
      if(!appEntry || !pane || appEntry.embed === false) return;
      const loading = document.createElement('div');
      loading.className = 'win-loading';
      loading.setAttribute('data-loading', '');
      loading.innerHTML = '<span class="spinner" aria-hidden="true"></span>';
      pane.appendChild(loading);
      this.setLive(appId, 'loading');
      const frame = this.embed.mount(appEntry, pane);
      if(frame.shown){ loading.remove(); this.setLive(appId, 'embedded'); }
    });
  }

  reloadTab(winId, appId){
    const win = this.wins.get(winId);
    if(!win) return;
    const appEntry = findById(appId);
    const pane = win.panes.get(appId);
    if(!appEntry || appEntry.embed === false || !pane || !this.embed.frames.has(appId)) return;
    this.embed.reset(appId);
    this.setLive(appId, 'loading');
    pane.appendChild(renderPaneLoading(`Reloading ${appEntry.name}…`));
    announce(`Reloading ${appEntry.name}`);
  }

  toggleMaximize(id){
    const win = this.wins.get(id);
    if(!win) return;
    if(!win.maximized) win.restoreFrame = { ...win.frame };
    win.maximized = !win.maximized;
    this.applyMaximize(win);
  }

  applyMaximize(win, instant){
    if(win.maximized){
      const inset = 12;
      const topbar = document.querySelector('.topbar');
      const top = (topbar ? topbar.getBoundingClientRect().bottom : 0) + inset;
      const target = { x:inset, y:top, w: innerWidth - inset * 2, h: innerHeight - top - inset - dockReserve };
      this.commitFrame(win, target, instant);
      win.frame = target;
    }else{
      const target = win.restoreFrame || win.frame;
      this.commitFrame(win, target, instant);
      win.frame = target;
      win.restoreFrame = null;
    }
    win.el.classList.toggle('is-maximized', win.maximized);
    this.persistGeometry(win);
  }

  commitFrame(win, frame, instant){
    const el = win.el;
    if(instant || reduced()){
      applyFrameStyles(el, frame);
      return;
    }
    cancelSpringsFor(el);
    const cs = getComputedStyle(el);
    const fromTransform = cs.transform && cs.transform !== 'none'
      ? cs.transform
      : `translate3d(${win.frame.x}px, ${win.frame.y}px, 0)`;
    withWillChange(el, 'transform, width, height', () =>
      animate(el, [
        { transform: fromTransform, width: cs.width, height: cs.height },
        { transform:`translate3d(${frame.x}px, ${frame.y}px, 0)`, width: frame.w + 'px', height: frame.h + 'px' }
      ], SPRING.standard)
    );
  }

  snapZoneFor(x, y){
    const topbar = document.querySelector('.topbar');
    const topY = topbar ? topbar.getBoundingClientRect().bottom : 0;
    if(y <= topY + EDGE_ZONE) return 'top';
    const nearLeft = x <= EDGE_ZONE;
    const nearRight = x >= innerWidth - EDGE_ZONE;
    const topQuarter = y <= topY + innerHeight * 0.25;
    const bottomQuarter = y >= innerHeight * 0.75;
    if(nearLeft && topQuarter) return 'top-left';
    if(nearLeft && bottomQuarter) return 'bottom-left';
    if(nearRight && topQuarter) return 'top-right';
    if(nearRight && bottomQuarter) return 'bottom-right';
    if(x <= EDGE_ZONE + 40) return 'left';
    if(x >= innerWidth - EDGE_ZONE - 40) return 'right';
    return null;
  }

  zoneRectFor(zone){
    const topbar = document.querySelector('.topbar');
    const top = topbar ? topbar.getBoundingClientRect().bottom : 0;
    const fullH = innerHeight - top - dockReserve;
    const map = {
      top: { x:8, y:top + 4, w: innerWidth - 16, h: fullH - 8 },
      left: { x:8, y:top + 4, w: innerWidth / 2 - 12, h: fullH - 8 },
      right: { x: innerWidth / 2 + 4, y:top + 4, w: innerWidth / 2 - 12, h: fullH - 8 },
      'top-left': { x:8, y:top + 4, w: innerWidth / 2 - 12, h: fullH / 2 - 8 },
      'top-right': { x: innerWidth / 2 + 4, y:top + 4, w: innerWidth / 2 - 12, h: fullH / 2 - 8 },
      'bottom-left': { x:8, y: top + fullH / 2 + 2, w: innerWidth / 2 - 12, h: fullH / 2 - 8 },
      'bottom-right': { x: innerWidth / 2 + 4, y: top + fullH / 2 + 2, w: innerWidth / 2 - 12, h: fullH / 2 - 8 }
    };
    return map[zone];
  }

  snap(id, zone){
    const win = this.wins.get(id);
    if(!win) return;
    if(zone === 'top'){
      if(!win.maximized) win.restoreFrame = { ...win.frame };
      win.maximized = true;
      this.applyMaximize(win);
    }else{
      win.maximized = false;
      win.restoreFrame = null;
      win.el.classList.remove('is-maximized');
      const r = this.zoneRectFor(zone);
      this.commitFrame(win, r);
      win.frame = r;
      this.persistGeometry(win);
    }
    this.checkInvariants('snap');
  }

  reflow(id){
    const win = this.wins.get(id);
    if(!win) return;
    if(win.maximized){
      this.applyMaximize(win, true);
      return;
    }

    const clamped = clampGeo(win.frame);
    if(clamped.x !== win.frame.x || clamped.y !== win.frame.y || clamped.w !== win.frame.w || clamped.h !== win.frame.h){
      this.commitFrame(win, clamped, true);
      win.frame = clamped;
      this.persistGeometry(win);
    }
  }

  cycle(){
    if(this.order.length < 2) return;
    const current = this.order.pop();
    this.order.unshift(current);
    this.reorderZ();
    const nextId = this.order[this.order.length - 1];
    const win = this.wins.get(nextId);
    announce(`${win?.app.name} focused`);
    this.dispatchEvent(new CustomEvent('focuschange', { detail:{ id: nextId } }));

    win?.el.querySelector('[data-drag]')?.focus();
    this.checkInvariants('cycle');
  }

  checkInvariants(scope){
    if(!DEV) return;
    const seen = new Set();
    this.order.forEach(id => {
      if(seen.has(id)) invariantWarn(scope, `duplicate id "${id}" in order`);
      seen.add(id);
      if(!this.wins.has(id)) invariantWarn(scope, `order contains "${id}" with no matching window`);
    });
    this.wins.forEach(win => {
      if(!win.tabs.includes(win.activeTab)){
        invariantWarn(scope, `window "${win.id}" activeTab "${win.activeTab}" not in its own tabs`);
      }
      win.tabs.forEach(t => {
        if(!win.panes.has(t)) invariantWarn(scope, `window "${win.id}" tab "${t}" has no pane`);
      });
      win.panes.forEach((_, paneId) => {
        if(!win.tabs.includes(paneId)) invariantWarn(scope, `window "${win.id}" has a pane for "${paneId}" that isn't a tab`);
      });
    });
    this.embed.frames.forEach((_, appId) => {
      if(!this.findWin(appId)) invariantWarn(scope, `mounted frame "${appId}" has no owning window`);
    });
  }

  bindDrag(win){
    const handle = win.el.querySelector('[data-drag]');
    const mobileQuery = matchMedia('(max-width: 768px)');
    let mode = null;

    let offset = null, preview = null, mergeTargetId = null;
    let startLeft = 0, startTop = 0, curDx = 0, curDy = 0;
    let lastPointer = null, rafId = null, activeZone = null;

    let sheetStartY = null, sheetLastY = null, sheetRafId = null;

    const getPreviewEl = () => {
      if(!preview){
        preview = document.createElement('div');
        preview.className = 'snap-preview';
        this.root.appendChild(preview);
        win._snapPreviewEl = preview;
      }
      return preview;
    };

    const clearDropHighlight = () => {
      document.querySelectorAll('.win-tb.is-drop-target').forEach(el => el.classList.remove('is-drop-target'));
    };

    const desktopProcessFrame = () => {
      rafId = null;
      if(!offset || !lastPointer) return;
      const rawY = lastPointer.y - offset.y;
      const x = lastPointer.x - offset.x;
      const y = Math.max(4, rawY);
      curDx = x - startLeft;
      curDy = y - startTop;
      win.el.style.transform = `translate3d(${x}px, ${y}px, 0)`;

      const hit = document.elementFromPoint(lastPointer.x, lastPointer.y);
      const targetTb = hit ? hit.closest('.win-tb') : null;
      const targetWinEl = targetTb ? targetTb.closest('.win') : null;
      const targetId = targetWinEl ? targetWinEl.dataset.app : null;

      clearDropHighlight();
      mergeTargetId = null;
      if(targetId && targetId !== win.id){
        targetTb.classList.add('is-drop-target');
        mergeTargetId = targetId;
        if(preview) preview.style.opacity = '0';
        activeZone = null;
        return;
      }

      const zone = this.snapZoneFor(lastPointer.x, lastPointer.y);
      if(zone !== activeZone){
        activeZone = zone;
        const el = getPreviewEl();
        if(zone){
          const r = this.zoneRectFor(zone);

          const fromTransform = el.style.transform || `translate3d(${r.x}px, ${r.y}px, 0)`;
          el.style.opacity = '1';
          animate(el, [
            { transform: fromTransform, width: el.style.width || r.w + 'px', height: el.style.height || r.h + 'px' },
            { transform:`translate3d(${r.x}px, ${r.y}px, 0)`, width:r.w + 'px', height:r.h + 'px' }
          ], SPRING.snappy);
        }else{
          el.style.opacity = '0';
        }
      }
    };
    const desktopSchedule = () => { if(rafId === null) rafId = requestAnimationFrame(desktopProcessFrame); };

    const sheetProcessFrame = () => {
      sheetRafId = null;
      if(sheetStartY === null || sheetLastY === null) return;
      const dy = Math.max(0, sheetLastY - sheetStartY);
      win.el.style.transform = `translate3d(0, ${dy}px, 0)`;
    };
    const sheetSchedule = () => { if(sheetRafId === null) sheetRafId = requestAnimationFrame(sheetProcessFrame); };

    handle.addEventListener('pointerdown', e => {

      mode = mobileQuery.matches ? 'mobile' : 'desktop';
      if(mode === 'mobile'){
        if(e.target.closest('.wc, [data-focus-content]')){ mode = null; return; }
        cancelSpringsFor(win.el);
        sheetStartY = e.clientY;
        sheetLastY = e.clientY;
        try{ handle.setPointerCapture(e.pointerId); }catch(err){}
        win.el.style.transition = 'none';
        this.focus(win.id);
        return;
      }
      if(e.target.closest('.wc, [data-focus-content]')){ mode = null; return; }
      cancelSpringsFor(win.el);
      if(win.maximized){
        const prevRect = win.el.getBoundingClientRect();
        const relX = prevRect.width ? (e.clientX - prevRect.left) / prevRect.width : 0.5;
        const restore = win.restoreFrame || { w: Math.min(720, innerWidth - 80), h: Math.min(480, innerHeight - dockReserve - 140) };
        win.maximized = false;
        win.el.classList.remove('is-maximized');
        const target = clampGeo({
          x: Math.round(e.clientX - restore.w * relX),
          y: Math.round(e.clientY - 20),
          w: restore.w, h: restore.h
        });
        win.restoreFrame = null;
        win.frame = target;
        applyFrameStyles(win.el, target);
        this.persistGeometry(win);
      }
      const rect = win.el.getBoundingClientRect();
      offset = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      startLeft = win.frame.x;
      startTop = win.frame.y;
      curDx = 0; curDy = 0;
      lastPointer = { x:e.clientX, y:e.clientY };
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}
      win.el.classList.add('is-drag-live');
      win.el.style.pointerEvents = 'none';
      this.focus(win.id);
    });

    handle.addEventListener('pointermove', e => {
      if(mode === 'mobile'){
        if(sheetStartY === null) return;
        sheetLastY = e.clientY;
        sheetSchedule();
      }else if(mode === 'desktop'){
        if(!offset) return;
        lastPointer = { x:e.clientX, y:e.clientY };
        desktopSchedule();
      }
    });

    ['pointerup', 'pointercancel'].forEach(evt => handle.addEventListener(evt, e => {
      if(mode === 'mobile'){
        if(sheetStartY === null) return;
        if(sheetRafId !== null){ cancelAnimationFrame(sheetRafId); sheetRafId = null; }
        const dy = Math.max(0, (sheetLastY ?? e.clientY) - sheetStartY);
        win.el.style.transition = '';
        sheetStartY = null; sheetLastY = null;
        if(dy > 140){
          this.close(win.id);
        }else{
          applyFrameStyles(win.el, win.frame);
        }
        mode = null;
        return;
      }
      if(mode !== 'desktop' || !offset) return;
      if(rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
      offset = null;
      lastPointer = null;
      win.el.classList.remove('is-drag-live');
      win.el.style.pointerEvents = '';
      clearDropHighlight();
      if(preview) preview.style.opacity = '0';

      if(mergeTargetId){
        const targetId = mergeTargetId;
        mergeTargetId = null;
        activeZone = null;
        mode = null;
        this.mergeInto(win.id, targetId);
        return;
      }
      if(activeZone){
        this.snap(win.id, activeZone);
        activeZone = null;
      }else{
        const finalFrame = { ...win.frame, x: startLeft + curDx, y: startTop + curDy };
        applyFrameStyles(win.el, finalFrame);
        win.frame = finalFrame;
        this.persistGeometry(win);
      }
      mode = null;
    }));
  }

  bindResize(win){
    let sharedGhost = null;
    const getGhost = () => {
      if(!sharedGhost){
        sharedGhost = document.createElement('div');
        sharedGhost.className = 'resize-ghost';
        this.root.appendChild(sharedGhost);
        win._resizeGhostEl = sharedGhost;
      }
      return sharedGhost;
    };

    win.el.querySelectorAll('[data-resize]').forEach(handle => {
      const dir = handle.dataset.resize;
      let start = null;
      let lastPointer = null;
      let rafId = null;
      let finalGeo = null;
      let snapshotEl = null;

      const processFrame = () => {
        rafId = null;
        if(!start || !lastPointer) return;
        const dx = lastPointer.x - start.x;
        const dy = lastPointer.y - start.y;
        let { left, top, width, height } = start.rect;
        if(dir.includes('e')) width += dx;
        if(dir.includes('s')) height += dy;
        if(dir.includes('w')){ width -= dx; left += dx; }
        if(dir.includes('n')){ height -= dy; top += dy; }
        width = Math.max(MIN_W, width);
        height = Math.max(MIN_H, height);
        finalGeo = { x:left, y:top, w:width, h:height };
        const el = getGhost();
        el.style.left = left + 'px';
        el.style.top = top + 'px';
        el.style.width = width + 'px';
        el.style.height = height + 'px';
        el.style.opacity = '1';
      };
      const schedule = () => { if(rafId === null) rafId = requestAnimationFrame(processFrame); };

      handle.addEventListener('pointerdown', e => {

        if(matchMedia('(max-width: 768px)').matches) return;
        e.stopPropagation();
        this.focus(win.id);
        cancelSpringsFor(win.el);
        start = { x:e.clientX, y:e.clientY, rect: { left: win.frame.x, top: win.frame.y, width: win.frame.w, height: win.frame.h } };
        lastPointer = { x:e.clientX, y:e.clientY };
        finalGeo = null;
        try{ handle.setPointerCapture(e.pointerId); }catch(err){}
        win.el.classList.add('is-resize-live');

        const activeApp = findById(win.activeTab);
        const pane = win.panes.get(win.activeTab);
        if(activeApp?.poster && pane){
          snapshotEl = document.createElement('div');
          snapshotEl.className = 'resize-snapshot';
          snapshotEl.style.backgroundImage = `url("${activeApp.poster}")`;
          pane.appendChild(snapshotEl);
        }
      });
      handle.addEventListener('pointermove', e => {
        if(!start) return;
        lastPointer = { x:e.clientX, y:e.clientY };
        schedule();
      });
      ['pointerup', 'pointercancel'].forEach(evt => handle.addEventListener(evt, () => {
        if(!start) return;
        if(rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
        win.el.classList.remove('is-resize-live');
        if(sharedGhost) sharedGhost.style.opacity = '0';
        snapshotEl?.remove();
        snapshotEl = null;
        start = null;
        lastPointer = null;
        if(finalGeo){
          applyFrameStyles(win.el, finalGeo);
          win.frame = { ...finalGeo };
          this.persistGeometry(win);
        }
        finalGeo = null;
      }));
    });
  }
}

const BASE = 52;
const PEAK_SCALE = 1.35;
const RADIUS = 110;
const LERP = 0.28;
const SETTLE_EPS = 0.001;
const DRAG_THRESHOLD = 6;
const TOOLTIP_DELAY = 400;

class Dock{
  constructor(el, apps, { onActivate, onShowDesktop }){
    this.el = el;
    this.apps = apps;
    this.onActivate = onActivate;
    this.onShowDesktop = onShowDesktop;
    this.tiles = [];
    this.tilesEl = null;
    this.mouseX = null;
    this.hovering = false;
    this.pressedId = null;
    this.draggingId = null;
    this.rafId = null;
    this.running = false;
    this._lastTick = null;

    this.openIds = new Set();
    this.minimizedIds = new Set();
    this.focusedId = null;
    this.tooltipEl = null;
    this.tooltipTimer = null;
    this.render();
    this.buildChrome();
    this.roving = rovingTabindex(this.el, '.dock-tile');
    this.bindMagnify();
    this.bindLaunchAndDrag();
    this.bindTooltip();
    addEventListener('resize', () => this.cacheRects());
  }

  buildChrome(){
    if(this.chromeBuilt) return;
    this.chromeBuilt = true;
    const divider = document.createElement('div');
    divider.className = 'dock-divider';
    divider.setAttribute('aria-hidden', 'true');
    this.el.appendChild(divider);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'dock-library-btn';
    btn.setAttribute('aria-label', 'Show desktop — minimise all windows');
    btn.title = 'Show desktop';
    btn.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-grid"></use></svg>';
    btn.addEventListener('click', () => this.onShowDesktop?.());
    this.el.appendChild(btn);
  }

  render(){
    const order = store.dockOrder(this.apps.map(a => a.id));

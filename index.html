    if(!this.tilesEl){
      this.tilesEl = document.createElement('div');
      this.tilesEl.className = 'dock-tiles';
      this.el.appendChild(this.tilesEl);
    }
    this.tilesEl.innerHTML = '';
    this.tiles = order.map(id => this.apps.find(a => a.id === id)).filter(Boolean).map(app => {
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'dock-tile';
      tile.dataset.app = app.id;
      tile.tabIndex = -1;
      tile.innerHTML = html`
        <svg class="icon" aria-hidden="true"><use href="#i-${app.icon}"></use></svg>
        <span class="dock-dot" data-open aria-hidden="true"></span>`;
      tile.classList.toggle('has-window', this.openIds.has(app.id));
      tile.classList.toggle('is-minimized', this.minimizedIds.has(app.id));
      tile.classList.toggle('is-focused', this.focusedId === app.id);
      this.updateTileLabel(tile, app);
      this.tilesEl.appendChild(tile);
      return { id: app.id, app, el: tile, cur: 1, target: 1, shift: 0, curShift: 0, centerX: 0 };
    });
    if(this.roving) this.roving.setActive(this.roving.items()[0]);
    this.cacheRects();
  }

  updateTileLabel(tile, app){
    const state = this.minimizedIds.has(app.id) ? ', minimised' : this.openIds.has(app.id) ? ', running' : '';
    tile.setAttribute('aria-label', `${app.name}${app.accel ? `, shortcut control ${app.accel}` : ''}${state}`);
  }

  cacheRects(){

    if(!this.tiles.length) return;
    const parent = this.tiles[0].el.offsetParent;
    const baseLeft = parent ? parent.getBoundingClientRect().left : 0;
    this.tiles.forEach(t => {
      t.centerX = baseLeft + t.el.offsetLeft + t.el.offsetWidth / 2;
    });
  }

  setOpenState(appId, isOpen){
    if(isOpen) this.openIds.add(appId); else{ this.openIds.delete(appId); this.minimizedIds.delete(appId); }
    const t = this.tiles.find(t => t.id === appId);
    if(!t) return;
    t.el.classList.toggle('has-window', isOpen);
    t.el.classList.toggle('is-minimized', this.minimizedIds.has(appId));
    this.updateTileLabel(t.el, t.app);
  }

  setMinimized(appId, isMin){
    if(isMin) this.minimizedIds.add(appId); else this.minimizedIds.delete(appId);
    const t = this.tiles.find(t => t.id === appId);
    if(!t) return;
    t.el.classList.toggle('is-minimized', isMin);
    this.updateTileLabel(t.el, t.app);
  }

  setActive(appId){
    this.focusedId = appId;
    this.tiles.forEach(t => t.el.classList.toggle('is-focused', t.id === appId));
  }

  rectFor(appId){
    const t = this.tiles.find(t => t.id === appId);
    return t ? t.el.getBoundingClientRect() : null;
  }

  bindMagnify(){
    this.el.addEventListener('pointerenter', () => { this.hovering = true; this.cacheRects(); this.wake(); });
    this.el.addEventListener('pointermove', e => { this.mouseX = e.clientX; this.wake(); });
    this.el.addEventListener('pointerleave', () => { this.hovering = false; this.mouseX = null; this.wake(); });
  }

  wake(){
    if(this.running) return;
    this.running = true;
    this.el.classList.add('is-animating');
    this._lastTick = null;
    this.rafId = requestAnimationFrame(t => this.tick(t));
  }

  tick(timestamp){

    const dt = this._lastTick ? Math.min(48, timestamp - this._lastTick) : 16.667;
    this._lastTick = timestamp;
    const k = 1 - Math.pow(1 - LERP, dt / 16.667);

    let settled = true;
    const extras = this.tiles.map(t => {
      let scale = 1;
      if(this.hovering && this.mouseX !== null){
        const dist = Math.abs(this.mouseX - t.centerX);
        if(dist < RADIUS) scale = 1 + (PEAK_SCALE - 1) * Math.pow(Math.cos((dist / RADIUS) * (Math.PI / 2)), 2);
      }
      t.target = this.pressedId === t.id ? scale * 0.96 : scale;
      return (scale - 1) * BASE;
    });

    this.tiles.forEach((t, i) => {
      let shift = 0;
      for(let j = 0; j < this.tiles.length; j++){
        if(j === i) continue;
        shift += 0.5 * extras[j] * (j < i ? 1 : -1);
      }
      t.shift = shift;
    });

    this.tiles.forEach(t => {
      if(t.id === this.draggingId) return;
      const dScale = t.target - t.cur;
      const dShift = t.shift - t.curShift;
      if(Math.abs(dScale) > SETTLE_EPS || Math.abs(dShift) > SETTLE_EPS) settled = false;
      t.cur += dScale * k;
      t.curShift += dShift * k;
      t.el.style.transform = `translateX(${t.curShift.toFixed(2)}px) scale(${t.cur.toFixed(4)})`;
    });

    if(settled && !this.hovering && !this.draggingId){
      this.running = false;
      this.el.classList.remove('is-animating');
      return;
    }
    this.rafId = requestAnimationFrame(t2 => this.tick(t2));
  }

  bounce(id){
    const t = this.tiles.find(t => t.id === id);
    if(!t || reduced()) return;
    t.cur = Math.max(t.cur, 1) * 1.22;
    this.wake();
  }

  bindLaunchAndDrag(){
    let dragState = null;

    this.el.addEventListener('pointerdown', e => {
      const tile = e.target.closest('.dock-tile');
      if(!tile) return;
      const id = tile.dataset.app;
      this.pressedId = id;
      this.wake();
      dragState = { id, tile, startX: e.clientX, moved:false };
      try{ tile.setPointerCapture(e.pointerId); }catch(err){}
    });

    this.el.addEventListener('pointermove', e => {
      if(!dragState) return;
      const dx = e.clientX - dragState.startX;
      if(!dragState.moved && Math.abs(dx) > DRAG_THRESHOLD){
        dragState.moved = true;
        this.draggingId = dragState.id;
      }
      if(!dragState.moved) return;
      dragState.tile.classList.add('is-dragging');
      dragState.tile.style.transform = `translateX(${dx}px) scale(1.1)`;
      const after = this.tiles.find(t => t.id !== dragState.id && e.clientX < t.centerX);
      const targetEl = after ? after.el : null;
      if(targetEl !== dragState.tile.nextSibling){
        this.tilesEl.insertBefore(dragState.tile, targetEl);
      }
    });

    ['pointerup', 'pointercancel'].forEach(evt => this.el.addEventListener(evt, e => {
      if(!dragState) return;
      const { id, tile, moved } = dragState;
      this.pressedId = null;
      this.draggingId = null;
      tile.classList.remove('is-dragging');
      tile.style.transform = '';
      if(moved){
        const newOrder = Array.from(this.tilesEl.children).map(el => el.dataset.app);
        store.setDockOrder(newOrder);
        this.render();
      }else{
        const app = this.apps.find(a => a.id === id);
        if(app){ this.bounce(id); this.onActivate(app, tile.getBoundingClientRect()); }
      }
      dragState = null;
      this.wake();
    }));

    this.el.addEventListener('keydown', e => {
      const tile = e.target.closest('.dock-tile');
      if(!tile) return;
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        const app = this.apps.find(a => a.id === tile.dataset.app);
        if(app){ this.bounce(tile.dataset.app); this.onActivate(app, tile.getBoundingClientRect()); }
      }
    });

    this.el.addEventListener('contextmenu', e => {
      const tile = e.target.closest('.dock-tile');
      if(!tile) return;
      e.preventDefault();
      const app = this.apps.find(a => a.id === tile.dataset.app);
      if(!app) return;
      this.onContextMenu?.(app, e.clientX, e.clientY);
    });
  }

  bindTooltip(){
    const show = tile => {
      const app = this.apps.find(a => a.id === tile.dataset.app);
      if(!app) return;
      if(!this.tooltipEl){
        this.tooltipEl = document.createElement('div');
        this.tooltipEl.className = 'dock-tooltip';
        this.tooltipEl.setAttribute('role', 'tooltip');
      }
      this.tooltipEl.textContent = app.name;
      if(this.tooltipEl.parentElement !== tile) tile.appendChild(this.tooltipEl);
      this.tooltipEl.style.left = '50%';
      requestAnimationFrame(() => this.tooltipEl?.classList.add('is-visible'));
    };
    const hide = () => {
      clearTimeout(this.tooltipTimer);
      this.tooltipTimer = null;
      this.tooltipEl?.classList.remove('is-visible');
    };
    this.el.addEventListener('pointerover', e => {
      const tile = e.target.closest('.dock-tile');
      if(!tile) return;
      clearTimeout(this.tooltipTimer);
      this.tooltipTimer = setTimeout(() => show(tile), TOOLTIP_DELAY);
    });
    this.el.addEventListener('pointerout', e => {
      const tile = e.target.closest('.dock-tile');
      if(!tile) return;
      if(e.relatedTarget && tile.contains(e.relatedTarget)) return;
      hide();
    });
    this.el.addEventListener('pointerdown', hide, true);
  }
}

function fuzzyMatch(query, text){
  if(!query) return { score:0, indices:[] };
  const q = query.toLowerCase();
  const t = text.toLowerCase();
  let qi = 0, ti = 0, score = 0, streak = 0;
  const indices = [];
  while(qi < q.length && ti < t.length){
    if(q[qi] === t[ti]){
      score += 10 + streak * 10;
      if(ti === 0) score += 20; else if(t[ti - 1] === ' ') score += 15;
      streak++; indices.push(ti); qi++;
    }else streak = 0;
    ti++;
  }
  return qi === q.length ? { score: score - t.length + ti, indices } : { score:-1, indices:[] };
}

function highlight(text, indices){
  if(!indices.length) return esc(text);
  let out = '', last = 0;
  indices.forEach(i => {
    out += esc(text.slice(last, i));
    out += `<mark>${esc(text[i])}</mark>`;
    last = i + 1;
  });
  out += esc(text.slice(last));
  return out;
}

function looksLikeUrl(q){
  if(!q || /\s/.test(q) || !q.includes('.')) return false;
  try{
    new URL(q.includes('://') ? q : `https://${q}`);
    return true;
  }catch(err){ return false; }
}

const PALETTE_WIDE_QUERY = matchMedia('(min-width: 900px)');

class Palette{
  constructor(el, ctx){
    this.el = el;
    this.ctx = ctx;
    this.input = el.querySelector('[data-input]');
    this.list = el.querySelector('[data-list]');
    this.badge = el.querySelector('[data-badge]');
    this.preview = el.querySelector('[data-preview]');
    this.results = [];
    this.activeIndex = 0;
    this.releaseFocus = null;
    this._justOpened = false;
    this.bind();
  }

  isOpen(){
    return this.el.classList.contains('is-open');
  }

  open(){
    if(this.isOpen()) return;
    this.el.classList.add('is-open');
    this.el.setAttribute('aria-hidden', 'false');

    this.input.setAttribute('aria-expanded', 'true');
    this.input.value = '';
    this._justOpened = true;
    this.render('');
    this.releaseFocus = trapFocus(this.el, { restoreFocusTo: document.activeElement });
  }

  close(){
    if(!this.isOpen()) return;
    this.hidePreview();
    this.el.classList.remove('is-open');
    this.el.setAttribute('aria-hidden', 'true');
    this.input.setAttribute('aria-expanded', 'false');
    this.releaseFocus?.();
    this.releaseFocus = null;
  }

  toggle(){
    this.isOpen() ? this.close() : this.open();
  }

  parseMode(raw){
    if(raw.startsWith('>')) return { mode:'cmd', q: raw.slice(1).trim() };
    if(raw.startsWith('/')) return { mode:'app', q: raw.slice(1).trim() };
    return { mode:'all', q: raw.trim() };
  }

  gather(mode, q){
    const pool = mode === 'cmd' ? COMMANDS : mode === 'app' ? APPS : [...APPS, ...COMMANDS];
    const rows = [];

    if(looksLikeUrl(q) && mode === 'all'){
      rows.push({ kind:'url', url: q.includes('://') ? q : `https://${q}`, group:'Actions', indices:[] });
    }

    if(!q){
      const recentIds = store.recentIds(4).filter(id => pool.find(p => p.id === id));
      recentIds.forEach(id => rows.push({ item: pool.find(p => p.id === id), group:'Recent', indices:[] }));
      const rest = pool.filter(p => !recentIds.includes(p.id));
      const cap = mode === 'all' ? 3 : rest.length;
      rest.slice(0, cap).forEach(item => rows.push({ item, group: item.kind === 'app' ? 'Apps' : 'Commands', indices:[] }));
      return rows;
    }

    const scored = pool.map(item => {
      const nameMatch = fuzzyMatch(q, item.name);
      let best = nameMatch;
      (item.keywords || []).forEach(k => {
        const m = fuzzyMatch(q, k);
        if(m.score > best.score) best = { score:m.score, indices: nameMatch.indices };
      });
      return { item, score: best.score, indices: nameMatch.indices };
    }).filter(r => r.score > -1);

    scored.forEach(r => { r.score += store.frecencyScore(r.item.id); });
    scored.sort((a, b) => b.score - a.score);
    scored.forEach(r => rows.push({ item:r.item, group: r.item.kind === 'app' ? 'Apps' : 'Commands', indices:r.indices }));
    return rows;
  }

  render(rawQuery){
    const { mode, q } = this.parseMode(rawQuery);
    this.mode = mode;
    this.badge.classList.toggle('show', rawQuery.length > 0);
    const allHint = PALETTE_WIDE_QUERY.matches
      ? '↵ Open · ⌘↵ New window · ⇧⌘↵ Add tab · ⌥↵ Browser'
      : '↵ Open · ⌘↵ New window · ⇧↵ Preview · ⌥↵ Browser';
    this.badge.textContent = mode === 'cmd' ? 'Commands' : mode === 'app' ? 'Apps' : allHint;
    this.list.innerHTML = '';
    this.results = this.gather(mode, q);

    if(!this.results.length){
      this.list.innerHTML = html`<div class="palette-empty">No results for &ldquo;<strong>${q}</strong>&rdquo;</div>`;
      this.activeIndex = -1;
      this.input.removeAttribute('aria-activedescendant');
      this.updateRailPreview();
      return;
    }

    let lastGroup = null;
    this.results.forEach((r, i) => {
      if(r.group !== lastGroup){
        lastGroup = r.group;
        const h = document.createElement('div');
        h.className = 'palette-group-h';

        h.setAttribute('role', 'presentation');
        h.textContent = r.group;
        this.list.appendChild(h);
      }
      const row = document.createElement('div');
      row.className = `palette-item${i === 0 ? ' is-active' : ''}`;
      row.id = `palette-item-${i}`;
      row.setAttribute('role', 'option');
      row.setAttribute('aria-selected', i === 0 ? 'true' : 'false');

      if(r.kind === 'url'){
        row.innerHTML = html`
          <div class="palette-icon"><svg class="icon"><use href="#i-external"></use></svg></div>
          <div class="palette-meta"><div class="palette-name">Open ${r.url}</div><div class="palette-sub">New window</div></div>
          <div class="palette-hint mono">↵</div>`;
      }else{
        const { item } = r;
        row.innerHTML = html`
          <div class="palette-icon"><svg class="icon"><use href="#i-${item.icon || 'search'}"></use></svg></div>
          <div class="palette-meta"><div class="palette-name">${raw(highlight(item.name, r.indices))}</div><div class="palette-sub">${item.kind === 'app' ? 'App' : 'Command'}${item.group ? ' · ' + item.group : ''}</div></div>
          ${raw(item.kind === 'app' ? `<button type="button" class="palette-escape" data-escape tabindex="-1" aria-label="Open ${esc(item.name)} in the browser, skipping preview"><svg class="icon"><use href="#i-external"></use></svg></button>` : '')}
          <div class="palette-hint mono">${item.accel || '↵'}</div>`;
        const escapeBtn = row.querySelector('[data-escape]');
        if(escapeBtn){
          escapeBtn.addEventListener('click', e => {
            e.stopPropagation();
            openExternal(item);
            this.close();
          });
        }
        if(item.kind === 'app'){
          row.addEventListener('contextmenu', e => {
            e.preventDefault();
            this.setActive(i);
            openMenu({ x:e.clientX, y:e.clientY, items: paletteRowMenu(item, this.ctx) });
          });
        }
      }
      row.addEventListener('pointerenter', () => this.setActive(i));
      row.addEventListener('click', () => { this.setActive(i); this.commit('open'); });
      this.list.appendChild(row);
    });

    this.activeIndex = 0;
    this.input.setAttribute('aria-activedescendant', 'palette-item-0');
    this.updateRailPreview();

    if(this._justOpened && !reduced()){
      const rows = Array.from(this.list.querySelectorAll('.palette-item'));
      rows.slice(0, 8).forEach((row, i) => {
        animate(row, [
          { opacity:0, transform:'translateY(4px)' },
          { opacity:1, transform:'translateY(0)' }
        ], { duration:170, delay: i * 12, easing:EASE.out });
      });
    }
    this._justOpened = false;
  }

  setActive(i){
    if(i < 0 || i >= this.results.length) return;
    this.activeIndex = i;
    this.list.querySelectorAll('.palette-item').forEach((el, idx) => {
      const active = idx === i;
      el.classList.toggle('is-active', active);
      el.setAttribute('aria-selected', active ? 'true' : 'false');
      if(active) el.scrollIntoView({ block:'nearest' });
    });
    this.input.setAttribute('aria-activedescendant', `palette-item-${i}`);
    this.updateRailPreview();
  }

  move(delta){
    if(!this.results.length) return;
    const next = (this.activeIndex + delta + this.results.length) % this.results.length;
    this.setActive(next);
  }

  updateRailPreview(){
    if(!PALETTE_WIDE_QUERY.matches) return;
    const r = this.results[this.activeIndex];
    const item = r && r.kind !== 'url' ? r.item : null;
    if(item && item.kind === 'app' && item.poster){
      this.showPreview(item);
    }else{
      this.preview.innerHTML = '';
      this.preview.hidden = false;
      this.preview.classList.remove('is-visible');
    }
  }

  showPreview(item){
    if(item.kind !== 'app' || !item.poster) return;
    this.preview.hidden = false;
    const origin = originOf(item.url) || '';
    const hostname = origin ? origin.replace(/^https?:\/\//, '') : item.url;
    const isOpen = this.ctx.wm.isOpen(item.id);
    this.preview.innerHTML = html`
      <div class="palette-preview-media">
        <img src="${item.poster}" alt="" class="palette-preview-art" />
      </div>
      <div class="palette-preview-body">
        <div class="palette-preview-name">${item.name}</div>
        <div class="palette-preview-id">
          <img class="palette-preview-favicon" data-favicon src="${origin}/favicon.ico" alt="" />
          <span class="mono palette-preview-host">${hostname}</span>
        </div>
        <div class="palette-preview-meta">
          ${raw(item.group ? `<span class="palette-preview-tag">${esc(item.group)}</span>` : '')}
          ${raw(item.accel ? `<span class="palette-preview-key mono">${esc(item.accel)}</span>` : '')}
          ${raw(isOpen ? `<span class="palette-preview-status"><span class="live-dot is-live"></span>Open</span>` : '')}
        </div>
        <div class="palette-preview-actions">
          <button type="button" class="btn-sig" data-act="open">
            <svg class="icon"><use href="#i-${item.icon || 'search'}"></use></svg>
            Open
          </button>
          <button type="button" class="palette-preview-btn" data-act="newwindow">
            <svg class="icon"><use href="#i-expand"></use></svg>
            New window
          </button>
          <button type="button" class="palette-preview-btn" data-act="external">
            <svg class="icon"><use href="#i-external"></use></svg>
            Browser
          </button>
        </div>
      </div>`;
    const favicon = this.preview.querySelector('[data-favicon]');
    favicon?.addEventListener('error', () => { favicon.style.display = 'none'; });
    this.preview.querySelectorAll('[data-act]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        this.commit(btn.dataset.act);
      });
    });
    requestAnimationFrame(() => {
      requestAnimationFrame(() => this.preview.classList.add('is-visible'));
    });
  }

  hidePreview(){
    if(!this.preview || this.preview.hidden) return;
    if(PALETTE_WIDE_QUERY.matches) return;
    const el = this.preview;
    el.classList.remove('is-visible');
    const settle = () => {
      el.hidden = true;
      el.innerHTML = '';
      el.removeEventListener('transitionend', settle);
    };
    el.addEventListener('transitionend', settle);
    setTimeout(() => { if(!el.hidden) settle(); }, 320);
  }

  commit(action){
    const r = this.results[this.activeIndex];
    if(!r) return;
    if(r.kind === 'url'){
      window.open(r.url, '_blank', 'noopener,noreferrer');
      this.close();
      return;
    }
    const { item } = r;
    if(item.kind === 'app'){
      if(action === 'preview'){ if(!PALETTE_WIDE_QUERY.matches) this.showPreview(item); return; }
      if(action === 'external'){ this.hidePreview(); openExternal(item); this.close(); return; }
      this.hidePreview();
      const dockRect = this.ctx.dock.rectFor(item.id);
      if(action === 'addtab'){
        const focused = this.ctx.wm.focusedId ? this.ctx.wm.wins.get(this.ctx.wm.focusedId) : null;
        if(focused && !focused.tabs.includes(item.id)) this.ctx.wm.addTab(focused, item);
        else this.ctx.wm.open(item, { flipFrom: dockRect });
      }else if(action === 'newwindow') this.ctx.wm.forceNew(item, dockRect);
      else this.ctx.wm.open(item, { flipFrom: dockRect });
      this.close();
    }else{
      item.run(this.ctx);
      store.recordRecent(item.id);
      this.close();
    }
  }

  bind(){
    this.input.addEventListener('input', e => this.render(e.target.value));
    this.input.addEventListener('keydown', e => {
      if(e.key === 'ArrowDown'){ e.preventDefault(); this.move(1); }
      else if(e.key === 'ArrowUp'){ e.preventDefault(); this.move(-1); }
      else if(e.key === 'Enter'){
        e.preventDefault();
        if((e.metaKey || e.ctrlKey) && e.shiftKey) this.commit('addtab');
        else if(e.metaKey || e.ctrlKey) this.commit('newwindow');
        else if(e.altKey) this.commit('external');
        else if(e.shiftKey) this.commit('preview');
        else this.commit('open');
      }else if(e.key === 'Escape'){
        e.stopPropagation();
        if(!PALETTE_WIDE_QUERY.matches && !this.preview.hidden){ this.hidePreview(); }
        else this.close();
      }
    });
    this.el.querySelector('[data-scrim]').addEventListener('click', () => this.close());
  }
}

class Desktop{
  constructor(root, ctx){
    this.root = root;
    this.ctx = ctx;
    this.searchEl = root.querySelector('[data-search]');
    this.jumpEl = root.querySelector('[data-jump]');
    this.jumpWrap = root.querySelector('[data-jump-wrap]');
    this.pinnedEl = root.querySelector('[data-pinned]');
    this.libraryCountEl = root.querySelector('[data-library-count]');
    this.bindSearch();
    this.renderJumpBack();
    this.renderPinned();
    this.bindCursorGrid();
    this.bindPullToSearch();
    this.bindContextMenu();
  }

  bindContextMenu(){
    this.root.addEventListener('contextmenu', e => {
      if(e.target !== this.root && !e.target.closest('.desktop-clockblock')) return;
      e.preventDefault();
      desktopMenu(this.ctx, e.clientX, e.clientY);
    });
  }

  bindSearch(){
    if(!this.searchEl) return;

    this.searchEl.addEventListener('click', () => this.ctx.palette.open());
  }

  renderJumpBack(){
    if(!this.jumpEl) return;
    const show = store.get('showContinueRow');
    const ids = show ? store.recentIds(8).filter(id => !this.ctx.wm.isOpen(id)).slice(0, 3) : [];
    this.jumpEl.innerHTML = '';
    const has = ids.length > 0;
    if(this.jumpWrap) this.jumpWrap.hidden = !has;
    ids.forEach(id => {
      const app = APPS.find(a => a.id === id);
      if(!app) return;
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'jump-tile';
      tile.innerHTML = html`<svg class="icon"><use href="#i-${app.icon}"></use></svg><span>${app.name}</span>`;
      tile.addEventListener('click', () => this.ctx.launch(app, tile));
      tile.addEventListener('contextmenu', e => {
        e.preventDefault();
        openMenu({ x:e.clientX, y:e.clientY, items: libraryTileMenu(app, this.ctx) });
      });
      bindLongPress(tile, e => openMenu({ x:e.clientX, y:e.clientY, items: libraryTileMenu(app, this.ctx) }));
      this.jumpEl.appendChild(tile);
    });
  }

  renderPinned(){
    if(!this.pinnedEl) return;
    const order = store.pinned(APPS.map(a => a.id));
    this.pinnedEl.innerHTML = '';
    order.forEach(id => {
      const app = APPS.find(a => a.id === id);
      if(!app) return;
      const isOpen = this.ctx.wm.isOpen(id);
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'pin-tile';
      tile.draggable = true;
      tile.dataset.id = id;
      tile.innerHTML = html`
        <svg class="icon"><use href="#i-${app.icon}"></use></svg>
        <span>${app.name}</span>
        <span class="pin-dot" data-pin-open="${id}" ${isOpen ? '' : 'hidden'}></span>`;
      tile.addEventListener('click', () => this.ctx.launch(app, tile));
      tile.addEventListener('contextmenu', e => {
        e.preventDefault();
        openMenu({ x:e.clientX, y:e.clientY, items: libraryTileMenu(app, this.ctx) });
      });
      bindLongPress(tile, e => openMenu({ x:e.clientX, y:e.clientY, items: libraryTileMenu(app, this.ctx) }));
      this.bindDragReorder(tile);
      this.pinnedEl.appendChild(tile);
    });
    if(this.libraryCountEl) this.libraryCountEl.textContent = order.length;
  }

  updatePinnedState(){
    if(!this.pinnedEl) return;
    this.pinnedEl.querySelectorAll('[data-pin-open]').forEach(dot => {
      dot.hidden = !this.ctx.wm.isOpen(dot.dataset.pinOpen);
    });
  }

  bindDragReorder(tile){
    tile.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', tile.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      requestAnimationFrame(() => tile.classList.add('is-dragging'));
    });
    tile.addEventListener('dragend', () => tile.classList.remove('is-dragging'));
    tile.addEventListener('dragover', e => e.preventDefault());
    tile.addEventListener('drop', e => {
      e.preventDefault();
      const draggedId = e.dataTransfer.getData('text/plain');
      if(!draggedId || draggedId === tile.dataset.id) return;
      const order = Array.from(this.pinnedEl.children).map(c => c.dataset.id);
      const from = order.indexOf(draggedId);
      const to = order.indexOf(tile.dataset.id);
      if(from === -1 || to === -1) return;
      order.splice(from, 1);
      order.splice(to, 0, draggedId);
      store.setPinned(order);
      this.renderPinned();
    });
  }

  bindCursorGrid(){
    const wallpaper = document.querySelector('[data-cursor-grid]');
    if(!wallpaper) return;
    let last = 0;
    addEventListener('pointermove', e => {
      if(document.body.dataset.windows && document.body.dataset.windows !== '0') return;
      const now = performance.now();
      if(now - last < 33) return;
      last = now;

      wallpaper.style.setProperty('--cx', e.clientX + 'px');
      wallpaper.style.setProperty('--cy', e.clientY + 'px');
    });
  }

  bindPullToSearch(){
    const indicator = this.root.querySelector('[data-pull-indicator]');
    if(!indicator) return;
    const mq = matchMedia('(max-width: 768px)');
    const THRESHOLD = 68;
    const MAX_PULL = 110;
    let startY = null;
    let dragging = false;

    const reset = () => {
      indicator.classList.remove('is-active');
      indicator.style.transform = '';
      indicator.style.opacity = '';
    };

    this.root.addEventListener('pointerdown', e => {
      if(!mq.matches || this.ctx.palette.isOpen()) return;
      if(this.root.scrollTop > 2) return;
      if(e.target.closest('button, a, input, [draggable="true"]')) return;
      startY = e.clientY;
      dragging = false;
    });

    this.root.addEventListener('pointermove', e => {
      if(startY === null || !mq.matches) return;
      const dy = e.clientY - startY;
      if(dy <= 6) return;
      dragging = true;
      const pull = Math.min(dy, MAX_PULL);
      const progress = Math.min(1, pull / THRESHOLD);
      indicator.classList.add('is-active');
      indicator.style.opacity = String(0.3 + progress * 0.7);
      indicator.style.transform = `translate(-50%, ${4 + pull * 0.35}px) scaleX(${0.6 + progress * 0.4})`;
    });

    const end = e => {
      if(startY === null) return;
      const dy = dragging ? (e.clientY ?? startY) - startY : 0;
      startY = null;
      reset();
      if(dragging && dy >= THRESHOLD) this.ctx.palette.open();
      dragging = false;
    };
    this.root.addEventListener('pointerup', end);
    this.root.addEventListener('pointercancel', end);
  }

  refresh(){
    this.renderJumpBack();
    this.updatePinnedState();
  }
}

function startClock(){
  let timer = null;

  function render(){
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    document.querySelectorAll('[data-clock], [data-topbar-clock]').forEach(el => { el.textContent = `${h}:${m}`; });
    document.querySelectorAll('[data-date]').forEach(el => {
      el.textContent = now.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
    });
  }

  function schedule(){
    render();
    const now = new Date();
    const msToNextMinute = 60000 - (now.getSeconds() * 1000 + now.getMilliseconds());
    timer = setTimeout(schedule, Math.max(250, msToNextMinute));
  }

  function stop(){
    if(timer){ clearTimeout(timer); timer = null; }
  }

  document.addEventListener('visibilitychange', () => {
    if(document.hidden) stop(); else schedule();
  });

  schedule();
}

function safeSessionGet(key){
  try{ return sessionStorage.getItem(key); }catch(err){ return null; }
}

function safeSessionSet(key, value){
  try{ sessionStorage.setItem(key, value); }catch(err){}
}

function runBoot(){
  const root = document.documentElement;
  const already = safeSessionGet('lxos:booted');
  const reducedPref = matchMedia('(prefers-reduced-motion: reduce)').matches;

  if(already || reducedPref){
    root.classList.remove('booting');
    root.classList.add('boot-done');
    safeSessionSet('lxos:booted', '1');
    return;
  }

  const stages = [['.substrate', 0], ['.topbar', 80], ['.dock-wrap', 160]];
  stages.forEach(([selector, delay]) => {
    const el = document.querySelector(selector);
    if(!el) return;
    setTimeout(() => el.classList.add('boot-in'), delay);
  });

  setTimeout(() => {
    root.classList.remove('booting');
    root.classList.add('boot-done');
    safeSessionSet('lxos:booted', '1');
  }, 600);
}

function moveDockOrder(appId, dir, ctx){
  const ids = APPS.map(a => a.id);
  const order = [...ctx.store.dockOrder(ids)];
  const idx = order.indexOf(appId);
  if(idx === -1) return;
  const next = idx + dir;
  if(next < 0 || next >= order.length) return;
  [order[idx], order[next]] = [order[next], order[idx]];
  ctx.store.setDockOrder(order);
  ctx.dock.render();
}

function removeFromDock(appId, ctx){
  const ids = APPS.map(a => a.id);
  ctx.store.setDockOrder(ctx.store.dockOrder(ids).filter(id => id !== appId));
  ctx.dock.render();
  announce('Removed from dock');
}

function addToDock(appId, ctx){
  const ids = APPS.map(a => a.id);
  const order = ctx.store.dockOrder(ids);
  if(!order.includes(appId)) ctx.store.setDockOrder([...order, appId]);
  ctx.dock.render();
  announce('Added to dock');
}

function toggleLibrary(appId, ctx, add){
  const ids = APPS.map(a => a.id);
  const current = ctx.store.pinned(ids);
  const next = add
    ? (current.includes(appId) ? current : [...current, appId])
    : current.filter(id => id !== appId);
  ctx.store.setPinned(next);
  ctx.desktop.renderPinned();
  announce(add ? 'Added to Library' : 'Removed from Library');
}

function appMenu(app, ctx){
  const { wm, dock } = ctx;
  const win = wm.findWin(app.id);
  const items = [];
  if(win){
    items.push({ type:'item', label:'Show', icon:'expand', action:() => { if(win.minimized) wm.restore(win.id); else wm.focus(win.id); } });
  }else{
    items.push({ type:'item', label:'Open', icon:'expand', action:() => wm.open(app, { flipFrom: dock.rectFor(app.id) }) });
  }
  items.push({ type:'item', label:'Open in New Window', icon:'grid', action:() => wm.forceNew(app, dock.rectFor(app.id)) });
  items.push({ type:'item', label:'Open Externally', icon:'external', action:() => openExternal(app) });
  return items;
}

function snapSubmenu(win, wm){
  return {
    type:'submenu', label:'Snap', icon:'expand',
    items:[
      { type:'item', label:'Left', action:() => wm.snap(win.id, 'left') },
      { type:'item', label:'Right', action:() => wm.snap(win.id, 'right') },
      { type:'item', label:'Top (Maximise)', action:() => wm.snap(win.id, 'top') },

      { type:'item', label:'Top Left', action:() => wm.snap(win.id, 'top-left') },

}

  } };
}

function dockTileMenu(app, ctx, running){
  const { wm, store, dock } = ctx;
  const win = wm.findWin(app.id);
  if(running && win){
    return [
      { type:'item', label:'Show', icon:'expand', action:() => { if(win.minimized) wm.restore(win.id); else wm.focus(win.id); } },
      { type:'item', label:'Minimise', icon:'minus', disabled: win.minimized, action:() => wm.minimize(win.id) },
      { type:'item', label: win.maximized ? 'Restore' : 'Maximise', icon:'expand', action:() => wm.toggleMaximize(win.id) },
      snapSubmenu(win, wm),
      { type:'separator' },
      { type:'item', label:'Open in New Window', icon:'grid', action:() => wm.forceNew(app, dock.rectFor(app.id)) },
      { type:'item', label:'Open Externally', icon:'external', action:() => openExternal(app) },
      { type:'separator' },
      resetWindowItem(app, ctx),
      { type:'item', label:'Close Window', icon:'close', danger:true, action:() => wm.close(win.id) }
    ];
  }
  const items = appMenu(app, ctx);
  items.push({ type:'separator' });
  const ids = APPS.map(a => a.id);
  const order = store.dockOrder(ids);
  const idx = order.indexOf(app.id);
  items.push({ type:'item', label:'Move Left', icon:'arrow-right', disabled: idx <= 0, action:() => moveDockOrder(app.id, -1, ctx) });
  items.push({ type:'item', label:'Move Right', icon:'arrow-right', disabled: idx === -1 || idx >= order.length - 1, action:() => moveDockOrder(app.id, 1, ctx) });
  items.push({ type:'item', label:'Remove from Dock', icon:'trash', danger:true, action:() => removeFromDock(app.id, ctx) });
  items.push({ type:'separator' });
  const pinned = store.pinned(ids);
  items.push(pinned.includes(app.id)
    ? { type:'item', label:'Remove from Library', icon:'trash', action:() => toggleLibrary(app.id, ctx, false) }
    : { type:'item', label:'Add to Library', icon:'grid', action:() => toggleLibrary(app.id, ctx, true) });
  items.push(resetWindowItem(app, ctx));
  return items;
}

function libraryTileMenu(app, ctx){
  const items = appMenu(app, ctx);
  items.push({ type:'separator' });
  items.push({ type:'item', label:'Remove from Library', icon:'trash', danger:true, action:() => toggleLibrary(app.id, ctx, false) });
  const ids = APPS.map(a => a.id);
  if(!ctx.store.dockOrder(ids).includes(app.id)){
    items.push({ type:'item', label:'Add to Dock', icon:'grid', action:() => addToDock(app.id, ctx) });
  }
  return items;
}

function paletteRowMenu(app, ctx){

    : { type:'item', label:'Add to Library', icon:'grid', action:() => toggleLibrary(app.id, ctx, true) });

}

  const bodyEl = document.querySelector('[data-info-body]');

    sheet.classList.remove('is-open');
    sheet.setAttribute('aria-hidden', 'true');
  }
  function open(title, bodyHtml){
    titleEl.textContent = title;
    bodyEl.innerHTML = bodyHtml;

    sheet.setAttribute('aria-hidden', 'false');

  document.querySelector('[data-info-scrim]').addEventListener('click', close);

      const body = SHORTCUT_GROUPS.map(g => html`

      `).join('') + `<div class="info-sheet-note">Shortcuts don't fire while focus is inside an embedded app — that's a browser/iframe boundary, not a bug.</div>`;

function initSettings(embed, toggleTheme){
  const panel = document.getElementById('settings');
  let release = null;

  function refresh(){
    const themeVal = panel.querySelector('[data-theme-val]');
    if(themeVal) themeVal.textContent = store.effectiveTheme();
    panel.querySelectorAll('[data-accent]').forEach(el => {
      el.classList.toggle('is-active', el.dataset.accent === store.get('accent'));
    });
    panel.querySelectorAll('[data-wallpaper]').forEach(el => {
      el.classList.toggle('is-active', el.dataset.wallpaper === store.get('wallpaper'));
    });
    panel.querySelector('[data-reduce-transparency]').checked = store.effectiveReduceTransparency();
    panel.querySelector('[data-reduce-motion]').checked = store.effectiveReduceMotion();
  }

  function open(){
    panel.classList.add('is-open');
    panel.setAttribute('aria-hidden', 'false');
    refresh();
    release = trapFocus(panel, { restoreFocusTo: document.activeElement });
  }
  function close(){
    panel.classList.remove('is-open');
    panel.setAttribute('aria-hidden', 'true');
    release?.();
    release = null;
  }

  panel.querySelector('[data-close-settings]').addEventListener('click', close);
  panel.querySelector('[data-scrim]').addEventListener('click', close);
  panel.addEventListener('keydown', e => { if(e.key === 'Escape') close(); });

  panel.querySelector('[data-action="toggle-theme"]').addEventListener('click', () => {
    toggleTheme(); refresh();
  });
  panel.querySelectorAll('[data-accent]').forEach(el => {
    el.addEventListener('click', () => { store.setAccent(el.dataset.accent); embed.broadcastTheme(); refresh(); });
  });
  panel.querySelectorAll('[data-wallpaper]').forEach(el => {
    el.addEventListener('click', () => { store.setWallpaper(el.dataset.wallpaper); refresh(); });
  });
  panel.querySelector('[data-reduce-transparency]').addEventListener('change', e => {
    store.set('reduceTransparency', e.target.checked);
    store.applyReduceTransparency();
  });
  panel.querySelector('[data-reduce-motion]').addEventListener('change', e => {
    store.setReduceMotion(e.target.checked);
  });

  return { open, close, toggle: () => panel.classList.contains('is-open') ? close() : open() };
}

function init(){
  applyPersistedAppearance();
  updateThemeIcon();
  runBoot();
  updateDockReserve();
  addEventListener('resize', updateDockReserve);
  if(typeof ResizeObserver !== 'undefined'){
    const dockWrap = document.querySelector('.dock-wrap');
    if(dockWrap) new ResizeObserver(updateDockReserve).observe(dockWrap);
  }

  const embed = new EmbedManager();
  const windowLayer = document.getElementById('window-layer');
  const wm = new WindowManager(windowLayer, embed);

  const dockEl = document.getElementById('dock');
  const dock = new Dock(dockEl, APPS, {
    onActivate: (app, rect) => {
      const win = wm.findWin(app.id);
      if(win && !win.minimized && wm.focusedId === win.id) wm.minimize(win.id);
      else wm.open(app, { flipFrom: rect });
    },
    onShowDesktop: () => wm.minimizeAll(),
    onContextMenu: (app, x, y) => {
      openMenu({ x, y, items: dockTileMenu(app, ctx, !!wm.findWin(app.id)) });
    }
  });

  const toggleTheme = () => { store.toggleTheme(); updateThemeIcon(); embed.broadcastTheme(); };
  const settings = initSettings(embed, toggleTheme);
  const infoSheet = initInfoSheet();

  const ctx = {
    wm, dock, store, settings, toggleTheme,
    openSettings: () => settings.open(),
    openShortcuts: () => infoSheet.openShortcuts(),
    openAbout: () => infoSheet.openAbout(),
    resetWorkspace,
    launch: (app, el) => wm.open(app, { flipFrom: el.getBoundingClientRect() })
  };

  const paletteEl = document.getElementById('palette');
  const palette = new Palette(paletteEl, ctx);
  ctx.palette = palette;

  const desktopEl = document.getElementById('desktop');
  const desktop = new Desktop(desktopEl, ctx);
  ctx.desktop = desktop;

  wm.onTitlebarContextMenu = (win, x, y) => openMenu({ x, y, items: titlebarMenu(win, ctx) });
  wm.onTabContextMenu = (win, appId, x, y) => openMenu({ x, y, items: tabMenu(win, appId, ctx) });

  document.querySelector('[data-lx-menu]').addEventListener('click', e => {
    lxMenu(ctx, e.currentTarget);
  });

  function updateFocusedTopbar(){
    const btn = document.querySelector('[data-topbar-focused]');
    const nameEl = document.querySelector('[data-topbar-focused-name]');
    const dot = document.querySelector('[data-topbar-focused-dot]');
    if(!btn || !nameEl || !dot) return;
    const win = wm.focusedId ? wm.wins.get(wm.focusedId) : null;
    if(!win){ btn.hidden = true; return; }
    const appEntry = findById(win.activeTab);
    btn.hidden = false;
    nameEl.textContent = appEntry ? appEntry.name : '';
    const state = wm.liveState.get(win.activeTab);
    if(state){ dot.hidden = false; dot.dataset.state = state; }
    else{ dot.hidden = true; delete dot.dataset.state; }
  }

  function updateWindowsPresence(){
    const openCount = [...wm.wins.values()].filter(w => !w.minimized).length;
    document.body.dataset.windows = String(openCount);
  }

  const runningSheet = document.getElementById('running-sheet');
  const runningList = document.querySelector('[data-running-list]');
  const mobileQuery = matchMedia('(max-width: 768px)');
  function renderRunningSheet(){
    if(!runningList) return;
    runningList.innerHTML = '';
    wm.order.forEach(id => {
      const win = wm.wins.get(id);
      if(!win) return;
      const appEntry = findById(win.activeTab);
      if(!appEntry) return;
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'running-sheet-row';
      const state = wm.liveState.get(win.activeTab);
      row.innerHTML = html`
        <svg class="icon"><use href="#i-${appEntry.icon}"></use></svg>
        <span>${appEntry.name}</span>
        ${raw(state ? `<span class="live-dot" data-state="${esc(state)}"></span>` : '')}`;
      row.addEventListener('click', () => {
        if(win.minimized) wm.restore(id); else wm.focus(id);
        closeRunningSheet();
      });
      runningList.appendChild(row);
    });
  }
  function openRunningSheet(){
    if(!runningSheet || !wm.order.length) return;
    renderRunningSheet();
    runningSheet.classList.add('is-open');
    runningSheet.setAttribute('aria-hidden', 'false');
  }
  function closeRunningSheet(){
    if(!runningSheet) return;
    runningSheet.classList.remove('is-open');
    runningSheet.setAttribute('aria-hidden', 'true');
  }
  document.querySelector('[data-running-scrim]')?.addEventListener('click', closeRunningSheet);
  document.querySelector('[data-topbar-focused]')?.addEventListener('click', () => {
    if(mobileQuery.matches) openRunningSheet();
  });

  wm.addEventListener('focuschange', e => { dock.setActive(e.detail.id); updateFocusedTopbar(); });
  wm.addEventListener('tabchange', () => updateFocusedTopbar());
  wm.addEventListener('winopen', e => {
    dock.setOpenState(e.detail.id, true);
    desktop.refresh();
    updateFocusedTopbar();
    updateWindowsPresence();
  });
  wm.addEventListener('winclose', e => {
    dock.setOpenState(e.detail.id, false);
    desktop.refresh();
    updateFocusedTopbar();
    updateWindowsPresence();
    if(runningSheet?.classList.contains('is-open')) renderRunningSheet();
  });
  wm.addEventListener('winminimize', e => {
    dock.setMinimized(e.detail.id, true);
    updateFocusedTopbar();
    updateWindowsPresence();
    if(runningSheet?.classList.contains('is-open')) renderRunningSheet();
  });
  wm.addEventListener('winrestore', e => {
    dock.setMinimized(e.detail.id, false);
    updateFocusedTopbar();
    updateWindowsPresence();
    if(runningSheet?.classList.contains('is-open')) renderRunningSheet();
  });
  embed.addEventListener('status', () => updateFocusedTopbar());
  embed.addEventListener('request-palette', () => palette.open());
  updateWindowsPresence();

  document.querySelector('[data-open-palette]').addEventListener('click', () => palette.open());
  document.querySelector('[data-toggle-theme]').addEventListener('click', toggleTheme);
  document.querySelector('[data-open-settings]').addEventListener('click', () => settings.open());

  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
    if(!store.get('theme')){ store.applyTheme(store.effectiveTheme()); updateThemeIcon(); embed.broadcastTheme(); }
  });

  startClock();

  document.addEventListener('keydown', e => {
    const meta = e.metaKey || e.ctrlKey;
    if(meta && e.key.toLowerCase() === 'k'){ e.preventDefault(); palette.open(); return; }
    if(meta && e.key.toLowerCase() === 'w' && wm.focusedId){ e.preventDefault(); wm.closeFocused(); return; }
    if(meta && e.key.toLowerCase() === 'm' && wm.focusedId){ e.preventDefault(); wm.minimizeFocused(); return; }
    if(meta && e.key === '`' && wm.order.length > 1){ e.preventDefault(); wm.cycle(); return; }
    if(meta && e.shiftKey && e.key.toLowerCase() === 'l'){ e.preventDefault(); toggleTheme(); return; }
    if(meta && (e.key === '/' || e.key === '?')){ e.preventDefault(); infoSheet.openShortcuts(); return; }
    if(meta && e.altKey && wm.focusedId){
      if(e.key === 'ArrowLeft'){ e.preventDefault(); wm.snap(wm.focusedId, 'left'); return; }
      if(e.key === 'ArrowRight'){ e.preventDefault(); wm.snap(wm.focusedId, 'right'); return; }
      if(e.key === 'ArrowUp'){ e.preventDefault(); wm.snap(wm.focusedId, 'top'); return; }
    }

    if(e.ctrlKey && /^[1-9]$/.test(e.key) && !isTypingTarget(e.target) && !palette.isOpen()){
      const app = APPS.find(a => a.accel === e.key);
      if(app){ e.preventDefault(); wm.open(app, { flipFrom: dock.rectFor(app.id) }); }
      return;
    }
    if(e.key === 'Escape'){
      if(palette.isOpen()) palette.close();
      else if(document.getElementById('settings').classList.contains('is-open')) settings.close();
      else if(infoSheet.isOpen()) infoSheet.close();
      else if(runningSheet?.classList.contains('is-open')) closeRunningSheet();
    }
  });

  window.addEventListener('beforeunload', () => {
    wm.wins.forEach(win => wm.persistGeometry(win));
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {

      navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker registration failed:', err));
    });
  }
}

try{
  init();
}catch(err){
  console.error('Lx failed to start', err);
  document.body.innerHTML = `
    <div class="noscript-notice">
      <div>
        <p style="margin-bottom:12px;font-weight:600">Lx couldn't start.</p>
        <p>Please reload the page. If this keeps happening, your browser may not support a required feature.</p>
      </div>
    </div>`;
}
</script>
</body>
</html>
